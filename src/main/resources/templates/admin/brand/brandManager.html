<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">

</head>


<body>
	<section id="container">

		<th:block th:replace="~{fragments/admin/common :: headMenu}"></th:block>
		<th:block th:replace="~{fragments/admin/common :: sideMenu('brand')}"></th:block>

		<section id="main-content">
			<section class="wrapper">
				<div class="row mt">
					<div class="col-lg-10">
						<h4>
							<i class="fa fa-angle-right"></i> 브랜드 관리
						</h4>
						<span class="alsert-messate">* 브랜드를 등록 및 삭제할 수 있습니다.</span><br>
						<span class="alsert-messate">* 대분류/중분류/소분류/제품등록이 존재하는 브랜드는 삭제할 수 없습니다.</span><br>
						<span class="alsert-messate">* 대분류/중분류/소분류/제품등록을 먼저 삭제 후 브랜드 삭제가 가능합니다.</span>
						<div class="row mt">
					<div class="col-md-12">
						<div class="content-panel">
							<div class="row search-section">
								<div class="col-md-12">
									<h6>
										<i class="fas fa-question-circle"></i> 기본 검색조건 설정
									</h6>
									<form class="form-inline" style="margin-bottom:15px;" role="form" method="POST"
										th:action="@{/admin/brandManager}">
										<div class="form-group">
											<select class="form-control" th:name="size" id="pageSize">
												<option th:value="10" th:selected="${brands.pageable.pageSize}=='10'">10개씩 보기</option>
												<option th:value="30" th:selected="${brands.pageable.pageSize}=='30'">30개씩 보기</option>
												<option th:value="50" th:selected="${brands.pageable.pageSize}=='50'">50개씩 보기</option>
												<option th:value="100" th:selected="${brands.pageable.pageSize}=='100'">100개씩 보기</option>
											</select>
										</div>
										<button type="submit" class="btn btn-theme">정렬</button>
									</form>
								</div>
							</div>
							<table class="table table-striped table-advance table-hover">
								<thead class="border-top">
									<tr>
										<th class="center">번호</th>
										<th class="center">제품명</th>
										<th class="center">비고</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="p:${brands}">
                                        <td class="center col-md-1" th:text="${p.id}">
                                            
                                        </td>
                                        <td class="col-md-10"><a class="black" th:text="${p.name}" th:href="@{|/admin/brandDetail/${p.id}|}">브랜드명</a></td>
										
										<td class="center">
                                            <button class="btn btn-primary btn-xs" th:onclick="|location.href='@{/admin/brandDetail/{id}(id=${p.id})}'|"><i class="fa fa-pencil"></i></button>
                                            <button class="btn btn-danger btn-xs" th:onclick="|brandDelete('${p.id}')|"><i class="fa fa-trash-o"></i></button>
                                        </td>
                                    </tr>
								</tbody>
							</table>
						</div>
						<div style="text-align:center;">
                            <nav aria-label="navigation" style="text-align: center;">
								<ul class="pagination justify-content-center">
									<li class="page-item"
										th:classappend="${1 == brands.pageable.pageNumber+1} ? 'disabled'">
										<a class="page-link" href="#"
										th:href="@{/admin/brandManager(page=0, size=${param.size}, smallId = ${smallId})}"
										tabindex="-1" aria-disabled="true">First</a>
									</li>
									<li class="page-item"
										th:classappend="${1 == brands.pageable.pageNumber+1} ? 'disabled'">
										<a class="page-link" href="#"
										th:href="@{/admin/brandManager(page=${brands.pageable.pageNumber - 1}, size=${param.size}, smallId = ${smallId})}"
										tabindex="-1" aria-disabled="true">Previous</a>
									</li>
									<li class="page-item"
										th:classappend="${i == brands.pageable.pageNumber+1} ? 'disabled'"
										th:each="i : ${#numbers.sequence(startPage, endPage)}">
										<a	class="page-link" href="#" th:text=${i}
										th:href="@{/admin/brandManager(page=${i-1}, size=${param.size}, smallId = ${smallId})}">1</a>
									</li>
									<li class="page-item"
										th:classappend="${brands.totalPages == brands.pageable.pageNumber + 1} ? 'disabled'">
										<a class="page-link" href="#"
										th:href="@{/admin/brandManager(page=${brands.pageable.pageNumber + 1}, size=${param.size})}">Next</a>
									</li>
									<li class="page-item"
										th:classappend="${brands.totalPages == brands.pageable.pageNumber + 1} ? 'disabled'">
										<a class="page-link" href="#"
										th:href="@{/admin/brandManager(page=${brands.totalPages-1}, size=${param.size}, smallId = ${smallId})}">Last</a>
									</li>
								</ul>
							</nav>
                        </div>
					</div>
				</div>
						
						
						
						
						<div class="form-panel" id="brandPanel">
							<form 
							role="form" 
							class="form-horizontal style-form" 
							method="POST" 
							enctype="multipart/form-data"
							action="/admin/brandInsert">
							  <div class="form-group has-success">
							    <label class="col-lg-2 control-label" for="type">브랜드 타입</label>
							     <div class="col-lg-10">
							      <select class="form-control gsc-selected-option-container" id="type" name="type" required>
								    <option value="" disabled selected>선택</option>
								    <option th:each="t : ${T(com.dev.BionLifeScienceWeb.model.brand.Brand.BrandType).values()}"
								            th:value="${t}"
								            th:text="${t.label}">
								    </option>
								  </select>
								  </div>
							  </div>
								<div class="form-group has-success">
									<label class="col-lg-2 control-label">브랜드명</label>
									<div class="col-lg-10">
										<input 
										type="text" 
										placeholder="브랜드 명칭 ex) Adidas"
										class="form-control" 
										name="name"
										required="required">
										<p class="help-block">* 브랜드명을 입력해 주세요</p>
									</div>
								</div>
								<div class="form-group has-success">
									<label class="col-lg-2 control-label">브랜드 로고</label>
									<div class="col-lg-10">
										<input 
										type="file" 
										class="form-control" 
										name="brandImage"
										accept=".png,.jpg,.jpeg,.svg" required />
										<p class="help-block">*  512px*384px 사이즈에 최적화 되어 있습니다.</p>
										<p class="help-block">* png, jpg, jpeg, svg 지원합니다.</p>
									</div>
								</div>
								
								<div class="form-group has-success">
									<label class="col-lg-2 control-label">브랜드 소개</label>
									<div class="col-lg-10">
										<textarea 
										class="form-control" 
										name="content"
										placeholder="브랜드 소개 ex) 멋진 신발을 만드는 회사"
										required="required"></textarea>
									</div>
								</div>
								
								<div class="form-group has-success">
								  <label class="col-lg-2 control-label">비주얼 이미지 (자사브랜드만 넣어주세요.)</label>
								  	<div class="col-lg-10">
								  		<input type="file"
									         id="visualImage"
									         name="visualImage"
									         accept="image/*"
									         class="form-control">
									
										  <!-- 미리보기 박스 -->
										  <div id="visualPreviewWrap" style="margin-top:10px; display:none;">
										    <img id="visualPreview" alt="미리보기"
										         style="max-width: 420px; height:auto; border:1px solid #ddd; padding:6px; background:#fff;">
										    <div style="margin-top:6px;">
										      <button type="button" id="visualRemoveBtn" class="btn btn-sm btn-default">미리보기 제거</button>
										    </div>
										  </div>
										
										  <!-- 수정화면: 기존 이미지가 있으면 초기 미리보기로 렌더 -->
										  <input type="hidden" id="visualExisting"
       											th:value="${editBrand?.brandVisualRoad} ?: ''">
								 	</div>
								</div>
								
								<div class="form-group has-success">
								  <label class="col-lg-2 control-label">상세 설명 (선택)</label>
								  	<div class="col-lg-10">
								  		 <textarea id="desc" name="desc"></textarea>
								 	</div>
								 	
								 	<div class="col-lg-offset-2 col-lg-10 right">
										<button class="btn btn-theme" type="submit" style="margin-top: 10px;">등록</button>
									</div>
								</div>

								<div class="form-group ">
									<label for="lastname" class="control-label col-lg-2">브랜드 삭제</label>
									<div class="col-lg-10">
										<select class="form-control" id="brandPanel">	
											<option value="">=== 브랜드 선택 ===</option>
											<option th:each="b:${brand}" th:text="${b.name}" th:value="${b.id}"></option>
										</select>
										<button type="button" class="btn btn-danger" id="brandDeleteBtn" style="margin-top: 10px;">삭제</button>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</section>
		</section>
	</section>
	<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
	<script src="/administration/lib/brandManager.js"></script>
	
	
	<!-- Summernote 라이브러리 -->
	<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.20/dist/summernote-lite.min.js"></script>


	
	<script>	
	
	$.summernote.plugins.imageSize100 = function (context) {
		  context.memo('button.imageSize100', function () {
		    return $.summernote.ui.button({
		      contents: '100%',
		      click: function () {
		        const $img = $(context.invoke('editor.restoreTarget')).closest('img');
		        $img.css('width', '100%');
		      }
		    }).render();
		  });
		};
		
		$.summernote.plugins.imageSize75 = function (context) {
			  context.memo('button.imageSize75', function () {
			    return $.summernote.ui.button({
			      contents: '75%',
			      click: function () {
			        const $img = $(context.invoke('editor.restoreTarget')).closest('img');
			        $img.css('width', '75%');
			      }
			    }).render();
			  });
			};

		$.summernote.plugins.imageSize50 = function (context) {
		  context.memo('button.imageSize50', function () {
		    return $.summernote.ui.button({
		      contents: '50%',
		      click: function () {
		        const $img = $(context.invoke('editor.restoreTarget')).closest('img');
		        $img.css('width', '50%');
		      }
		    }).render();
		  });
		};

		$.summernote.plugins.imageSize25 = function (context) {
		  context.memo('button.imageSize25', function () {
		    return $.summernote.ui.button({
		      contents: '25%',
		      click: function () {
		        const $img = $(context.invoke('editor.restoreTarget')).closest('img');
		        $img.css('width', '25%');
		      }
		    }).render();
		  });
		};
		
		
		$.extend($.summernote.plugins, {
			  tableCellColor: function (context) {
			    const ui = $.summernote.ui;
			    
			    // 공통 셀 선택 함수
			    function getSelectedCells() {
			      const sel = window.getSelection();
			      if (!sel.rangeCount) return [];
			      const range = sel.getRangeAt(0);

			      const fragment = range.cloneContents();
			      const tempDiv = document.createElement('div');
			      tempDiv.appendChild(fragment);
			      const selectedCells = tempDiv.querySelectorAll('td,th');

			      if (selectedCells.length > 0) {
			        // 여러 셀 선택
			        return Array.from(range.cloneContents().querySelectorAll('td,th'))
			          .map(el => {
			            return Array.from(document.querySelectorAll('td,th'))
			              .find(c => c.textContent === el.textContent);
			          }).filter(Boolean);
			      } else {
			        // 단일 셀
			        const singleCell = $(range.startContainer).closest('td,th')[0];
			        return singleCell ? [singleCell] : [];
			      }
			    }
			    
			    context.memo('button.tableBorderColor', function () {
			        const $input = $('<input type="color" style="display:none;">').appendTo(document.body);

			        $input.on('input', function () {
			          const color = this.value;
			          getSelectedCells().forEach(cell => {
			            cell.style.borderColor = color;
			          });
			        });

			        return ui.button({
			          contents: '<i class="note-icon-magic"></i>',
			          click: function () { $input.trigger('click'); }
			        }).render();
			        
			      });
			    

			    context.memo('button.tableCellColor', function () {
			      // 숨겨진 color input
			      const $input = $('<input type="color" style="display:none;">').appendTo(document.body);

			      $input.on('input', function () {
			        const color = this.value;
			        const sel = window.getSelection();
			        if (!sel.rangeCount) return;

			        context.invoke('editor.beforeCommand');

			        // 현재 선택된 영역
			        const range = sel.getRangeAt(0);
			        const container = range.commonAncestorContainer;

			        // 선택된 여러 셀 찾기
			        let $cells = $(container).closest('td,th');
			        if ($cells.length === 0 && container.querySelectorAll) {
			          $cells = $(container).find('td,th');
			        }

			        if ($cells.length > 0) {
			          $cells.each(function () {
			            this.style.backgroundColor = color;
			          });
			        } else {
			          // 단일 셀 클릭한 경우
			          const singleCell = $(range.startContainer).closest('td,th')[0];
			          if (singleCell) {
			            singleCell.style.backgroundColor = color;
			          }
			        }

			        context.invoke('editor.afterCommand');
			      });

			      return ui.button({
			        contents: '<i class="note-icon-pencil"></i>',
			        click: function () {
			          $input.trigger('click'); // 컬러 피커 실행
			        }
			      }).render();
			      
			    });
			  }
			});

	let lastRange = null;

	$('#desc').summernote({
	    height: 570,
	    minHeight: null,
	    maxHeight: null,
	    focus: true,
	    lang: 'ko-KR',
	    placeholder: '브랜드 상세 설명(선택)',
	    toolbar: [
	      ['style', ['bold', 'italic', 'underline', 'strikethrough' , 'clear']],
	      ['font', ['fontsize', 'fontname', 'color']],
	      ['height',['height']],
	      ['para', ['ul', 'ol', 'paragraph']],
	      ['insert', ['link', 'picture', 'video', 'table', 'hr']],
	      ['view', ['fullscreen', 'codeview', 'help']],
	    ],
	    popover: {
	        image: [
	          ['custom', ['imageSize100','imageSize75' ,'imageSize50', 'imageSize25']],
	          ['float', ['floatLeft', 'floatRight', 'floatNone']],          
	          ['remove', ['removeMedia']]                              
	        ],
	        table: [
	            ['add', ['addRowDown', 'addRowUp', 'addColLeft', 'addColRight']],
	            ['delete', ['deleteRow', 'deleteCol', 'deleteTable']],
	            ['merge', ['mergeCell', 'splitCell']],
	            ['custom', ['tableCellColor','tableBorderColor', 'tableBorderWidth']]
	          ]
	      },
	    fontSizes: Array.from({ length: 65 }, (_, i) => (i + 8).toString()),
	    fontNames: ['Arial', 'Verdana', 'Times New Roman', 'Noto Sans KR', 'IBM Plex Sans KR', '맑은 고딕','궁서','굴림'],
	    styleTags: [
	      'p',
	      { title: 'Blockquote', tag: 'blockquote', className: 'blockquote', value: 'blockquote' },
	      'pre', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6'
	    ],
	    lineHeights: ['0.8', '1.0', '1.2', '1.4', '1.5', '2.0', '3.0'],
	    callbacks: {
	    	  onInit: function () {
	    	    $('.note-editable').css({ 'background-color': '#fff' });
	    	  },
    	
	    	  onChange: function (contents, $editable) {
	    	    $('.note-editable table td').resizable({
	    	      handles: "e, s",
	    	      minWidth: 50,
	    	      minHeight: 30
	    	    });
	    	  }
	    },
	    codeviewFilter: false, 
	    codeviewIframeFilter: false, 
	    onPaste: function (e) {
	    	  e.preventDefault(); // 기본 붙여넣기 막기

	    	  const clipboardData = (e.originalEvent || e).clipboardData;
	    	  const html = clipboardData.getData('text/html');
	    	  const text = clipboardData.getData('text/plain');

	    	  $('#desc').summernote('focus'); // 커서 위치 복원

	    	  if (html) {
	    	    document.execCommand('insertHTML', false, html); // HTML 붙여넣기
	    	  } else {
	    	    document.execCommand('insertText', false, text); // 텍스트만 있을 경우
	    	  }
	    	}

	  });
	
	</script>
	
	<script>
		(function () {
		
		  const input      = document.getElementById('visualImage');
		  const wrap       = document.getElementById('visualPreviewWrap');
		  const img        = document.getElementById('visualPreview');
		  const removeBtn  = document.getElementById('visualRemoveBtn');
		  const existing   = document.getElementById('visualExisting')?.value || '';
		
		  // 수정 화면에서 기존 비주얼 이미지가 있을 경우 초기 표시
		  if (existing) {
		    img.src = existing.startsWith('http') ? existing : existing; // 필요시 prefix
		    wrap.style.display = 'block';
		  }
		
		  // 파일 선택 → 미리보기
		  input.addEventListener('change', function () {
		    if (!this.files || !this.files[0]) {
		      clearPreview();
		      return;
		    }
		
		    const file = this.files[0];
		
		    // 간단한 타입/용량 체크(선택)
		    if (!file.type.startsWith('image/')) {
		      alert('이미지 파일만 업로드할 수 있습니다.');
		      this.value = '';
		      clearPreview();
		      return;
		    }
		    // if (file.size > 5 * 1024 * 1024) { ... } // 5MB 제한 예시
		
		    const reader = new FileReader();
		    reader.onload = e => {
		      img.src = e.target.result;
		      wrap.style.display = 'block';
		    };
		    reader.readAsDataURL(file);
		  });
		
		  removeBtn.addEventListener('click', function () {
		    input.value = '';
		    clearPreview();
		  });
		
		  function clearPreview() {
		    img.src = '';
		    wrap.style.display = 'none';
		  }
		
		})();
	</script>
	
	<script>
		$(function() {
			  function toggleVisual() {
			    let selectedType = $('#type').val(); 
			    if (selectedType === 'OWN') {
			      $('#visualImageWrap').show();
			    } else {
			      $('#visualImageWrap').hide();
			    }
			  }

			  // 최초 실행 (수정화면 진입 시 선택된 값 반영)
			  toggleVisual();

			  // 값 변경될 때마다 실행
			  $('#type').on('change', toggleVisual);
			});
		</script>
	
	
</body>
</html>

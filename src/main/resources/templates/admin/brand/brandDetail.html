<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/admin/common :: headMenu">

</head>


<body>
	<section id="container">

		<th:block th:replace="fragments/admin/common :: headMenu"></th:block>
		<th:block th:replace="fragments/admin/common :: sideMenu('brand')"></th:block>

		<section id="main-content">
			<section class="wrapper">
				<div class="row mt">
					<div class="col-lg-10">
						<h4>
							<i class="fa fa-angle-right"></i> 브랜드 관리
						</h4>
						<span class="alsert-messate">* 브랜드를 등록 및 삭제할 수 있습니다.</span><br>
						<span class="alsert-messate">* 대분류/중분류/소분류/제품등록이 존재하는 브랜드는 삭제할 수 없습니다.</span><br>
						<span class="alsert-messate">* 대분류/중분류/소분류/제품등록을 먼저 삭제 후 브랜드 삭제가 가능합니다.</span>
						<div class="form-panel" id="brandPanel">
							<form 
							role="form" 
							class="form-horizontal style-form" 
							method="POST" 
							enctype="multipart/form-data"
							action="/admin/brandUpdate">
								<input type="hidden" th:value="${brand.id}" name="id">
								<div class="form-group has-success">
							    <label class="col-lg-2 control-label" for="type">브랜드 타입</label>
							     <div class="col-lg-10">
							      <select class="form-control gsc-selected-option-container" id="type" name="type" required>
								    <option value="" disabled>선택</option>
								    <option th:each="t : ${T(com.dev.BionLifeScienceWeb.model.brand.Brand.BrandType).values()}"
									        th:value="${t}"
									        th:text="${t.name() == 'OWN' ? '자사브랜드' : '타사브랜드'}"
									        th:selected="${t.name() == brand.type?.name()}">
									</option>
								  </select>
								  </div>
							  </div>
							
							
								<div class="form-group has-success">
									<label class="col-lg-2 control-label">브랜드명</label>
									<div class="col-lg-10">
										<input 
										type="text" 
										placeholder="브랜드 명칭 ex) Adidas"
										class="form-control" 
										name="name"
										required="required"
										th:value="${brand.name}">
										<p class="help-block">* 브랜드명을 입력해 주세요</p>
									</div>
								</div>
								<div class="form-group has-success">
								  <label class="col-lg-2 control-label">브랜드 로고</label>
								  <div class="col-lg-10">
									  <!-- 기존 값 보존 -->
									  <input type="hidden" name="imagePath" th:value="${brand.imagePath}">
									  <input type="hidden" name="imageRoad" th:value="${brand.imageRoad}">
									  <input type="hidden" name="imageName" th:value="${brand.imageName}">
									
									  <!-- 파일 업로드 -->
									  <input type="file" name="brandImage" accept=".png,.jpg,.jpeg,.svg">
									

								    <p class="help-block">* 512×384 권장 / png, jpg, jpeg, svg</p>
								
								    <!-- brand.imageRoad 가 있을 경우 -->
								    <div th:if="${brand.imageRoad}">
								      <small>현재 로고 미리보기</small><br>
								      <img th:src="${brand.imageRoad}"
								           style="max-width:180px;border:1px solid #ddd;padding:4px;">
								    </div>
								  </div>
								</div>
								
								
								<!-- 비주얼 이미지 (선택) -->
								<div class="form-group has-success">
								  <label class="col-lg-2 control-label">비주얼 이미지 (선택)</label>
								  <div class="col-lg-10">
								    <input type="file" id="visualImage" name="visualImage" accept="image/*" class="form-control">
								
								    <!-- brand.visualRoad 가 있을 경우 -->
								    <div th:if="${brand.visualRoad}">
								      <small>현재 비주얼 미리보기</small><br>
								      <img th:src="${brand.visualRoad}"
								           style="max-width:420px;border:1px solid #ddd;padding:6px;background:#fff;">
								    </div>
								    
							    	<p class="help-block">* 1920px * 460px의 사이즈에 최적화 되어 있습니다.</p>
									<p class="help-block">* jpg / jpeg / png 확장자를 지원 합니다.</p>
									<p class="help-block">* 변경없이 수정시 기존의 이미지를 사용합니다.</p>
								  </div>
								</div>
								
								
								<!-- 본문(에디터) -->
			                    <div class="form-group has-success">
								  <label class="col-lg-2 control-label">상세 설명 (선택)</label>
								  	<div class="col-lg-10">
								  		 <textarea id="desc" name="desc" th:utext="${brand.desc}"></textarea>
								 	</div>
								</div>
																								
								<div class="form-group has-success">
									<label class="col-lg-2 control-label">브랜드 소개</label>
									<div class="col-lg-10">
										<textarea 
										class="form-control" 
										name="content"
										placeholder="브랜드 소개 ex) 멋진 신발을 만드는 회사"
										required="required"
										th:text="${brand.content}"></textarea>
									</div>
									<div class="col-lg-offset-2 col-lg-10">
										<button class="btn btn-danger" type="submit" style="margin-top: 10px;">수정</button>
										<button class="btn btn-theme" type="button" onclick="javascript:location.href='/admin/brandManager'" style="margin-top: 10px;">확인</button>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
			</section>
		</section>
	</section>
	<th:block th:replace="fragments/admin/common :: scriptSrc"></th:block>
	<script src="/administration/lib/brandManager.js"></script>
	
	
	<!-- Summernote 라이브러리 -->
	<link href="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.20/summernote-lite.min.css" rel="stylesheet">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/summernote/0.8.20/summernote-lite.min.js"></script>



	<script>
	$('#desc').summernote({
	    height: 220,
	    placeholder: '브랜드 상세 설명(선택)',
	    toolbar: [
	      ['style', ['bold', 'italic', 'underline', 'clear']],
	      ['font', ['fontsize', 'fontname', 'color']],
	      ['para', ['ul', 'ol', 'paragraph']],
	      ['insert', ['table', 'link', 'picture', 'video']],
	      ['view', ['fullscreen', 'codeview', 'help']]
	    ],
	    fontSizes: Array.from({ length: 65 }, (_, i) => (i + 8).toString()), // 8px ~ 72px까지 1px 단위
	    fontNames: ['Arial', 'Verdana', 'Times New Roman', 'Noto Sans KR', 'IBM Plex Sans KR'], // 필요시 확장
	    styleTags: [
	      'p',
	      { title: 'Blockquote', tag: 'blockquote', className: 'blockquote', value: 'blockquote' },
	      'pre', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6'
	    ],
	    lineHeights: ['0.8', '1.0', '1.2', '1.4', '1.5', '2.0', '3.0'],
	    callbacks: {
	      onInit: function () {
	        $(this).summernote('focus');
	      },
	      onChange: function (contents, $editable) {
	        // 필요 시 내용 변경 감지 (ex: 글자 수, 미리보기 반영)
	        console.log('내용 변경:', contents);
	      },
	      onPaste: function (e) {
	        // 붙여넣기 시 불필요한 스타일 제거 → 순수 텍스트만 삽입
	        let clipboardData = (e.originalEvent || e).clipboardData;
	        if (clipboardData && clipboardData.getData) {
	          e.preventDefault();
	          let text = clipboardData.getData('text/plain');
	          document.execCommand('insertText', false, text);
	        }
	      },
	      onBeforeCommand: function () {
	        // 테이블 삽입 시 커서 위치 유지 보정
	        $(this).summernote('focus');
	      }
	    }
	  });
	</script>
	
	<script>
		(function () {
		
		  const input      = document.getElementById('visualImage');
		  const wrap       = document.getElementById('visualPreviewWrap');
		  const img        = document.getElementById('visualPreview');
		  const removeBtn  = document.getElementById('visualRemoveBtn');
		  const existing   = document.getElementById('visualExisting')?.value || '';
		
		  // 수정 화면에서 기존 비주얼 이미지가 있을 경우 초기 표시
		  if (existing) {
		    img.src = existing.startsWith('http') ? existing : existing; // 필요시 prefix
		    wrap.style.display = 'block';
		  }
		
		  // 파일 선택 → 미리보기
		  input.addEventListener('change', function () {
		    if (!this.files || !this.files[0]) {
		      clearPreview();
		      return;
		    }
		
		    const file = this.files[0];
		
		    // 간단한 타입/용량 체크(선택)
		    if (!file.type.startsWith('image/')) {
		      alert('이미지 파일만 업로드할 수 있습니다.');
		      this.value = '';
		      clearPreview();
		      return;
		    }
		    // if (file.size > 5 * 1024 * 1024) { ... } // 5MB 제한 예시
		
		    const reader = new FileReader();
		    reader.onload = e => {
		      img.src = e.target.result;
		      wrap.style.display = 'block';
		    };
		    reader.readAsDataURL(file);
		  });
		
		  removeBtn.addEventListener('click', function () {
		    input.value = '';
		    clearPreview();
		  });
		
		  function clearPreview() {
		    img.src = '';
		    wrap.style.display = 'none';
		  }
		
		})();
	</script>
</body>
</html>

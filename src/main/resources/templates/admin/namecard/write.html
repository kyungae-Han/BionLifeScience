<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">
</head>

<body>
	<section id="container">

		<th:block th:replace="~{fragments/admin/common :: headMenu}"></th:block>

		<th:block th:replace="~{fragments/admin/common :: sideMenu('namecard')}"></th:block>

		<section id="main-content">
			<section class="wrapper">
				<div class="row mt">
					<div class="col-lg-10">
						<h4>
							<i class="fa fa-angle-right"></i> 디지털 명함 관리
						</h4>

						<div class="form-panel">
							<form role="form" action="/admin/namecardManager" class="form-horizontal style-form"
								  method="POST" enctype="multipart/form-data">
								<input type="hidden" name="nameCardId" th:value="${card.nameCardId}">

								<div class="form-group">
									<label class="col-sm-2 control-label">명함 주소</label>
									<div class="col-sm-10">
										<input type="text" name="slug" class="form-control" th:value="${card.slug}"
											   placeholder="dh_jang" required>
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">노출</label>
									<div class="col-sm-10">
										<label><input type="checkbox" name="useYn" value="Y"
													  th:checked="${card.useYn == null or card.useYn == 'Y'}"> 명함 주소를 사용합니다</label>
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">이름</label>
									<div class="col-sm-5">
										<input type="text" name="nameKo" class="form-control" th:value="${card.nameKo}"
											   placeholder="장동훈" required>
									</div>
									<div class="col-sm-5">
										<input type="text" name="nameEn" class="form-control" th:value="${card.nameEn}"
											   placeholder="DongHoon Jang">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">직함</label>
									<div class="col-sm-5">
										<input type="text" name="titleKo" class="form-control" th:value="${card.titleKo}" placeholder="부장">
									</div>
									<div class="col-sm-5">
										<input type="text" name="titleEn" class="form-control" th:value="${card.titleEn}" placeholder="General Manager">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">부서</label>
									<div class="col-sm-5">
										<input type="text" name="deptKo" class="form-control" th:value="${card.deptKo}" placeholder="광학솔루션사업부">
									</div>
									<div class="col-sm-5">
										<input type="text" name="deptEn" class="form-control" th:value="${card.deptEn}" placeholder="Optical Solution Business Department">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">회사명</label>
									<div class="col-sm-5">
										<input type="text" name="companyKo" class="form-control"
											   th:value="${card.companyKo} ?: '(주)바이온라이프사이언스'">
									</div>
									<div class="col-sm-5">
										<input type="text" name="companyEn" class="form-control"
											   th:value="${card.companyEn} ?: 'Bion Lifescience, Inc.'">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">휴대전화</label>
									<div class="col-sm-10">
										<input type="text" name="mobile" class="form-control" th:value="${card.mobile}" placeholder="010-5541-0988">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">대표전화</label>
									<div class="col-sm-5">
										<input type="text" name="tel" class="form-control" th:value="${card.tel}" placeholder="031-572-1992">
									</div>
									<div class="col-sm-5">
										<input type="text" name="fax" class="form-control" th:value="${card.fax}" placeholder="팩스 031-572-2273">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">이메일</label>
									<div class="col-sm-10">
										<input type="email" name="email" class="form-control" th:value="${card.email}"
											   placeholder="dh_jang@bionlifescience.com">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">주소</label>
									<div class="col-sm-5">
										<textarea name="addressKo" class="form-control" rows="3"
												  placeholder="12106 경기도 남양주시 순화궁로 282&#10;에이스하이엔드타워 1006호 (별내동)"
												  th:text="${card.addressKo}"></textarea>
									</div>
									<div class="col-sm-5">
										<textarea name="addressEn" class="form-control" rows="3"
												  placeholder="#1006, 10th Fl., Ace High-End Tower,&#10;282 Sunhwagung-ro, Namyangju-si,&#10;Gyeonggi-do 12106, Republic of Korea"
												  th:text="${card.addressEn}"></textarea>
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">지도 검색어</label>
									<div class="col-sm-5">
										<input type="text" name="mapQueryKo" class="form-control" th:value="${card.mapQueryKo}"
											   placeholder="경기도 남양주시 순화궁로 282">
									</div>
									<div class="col-sm-5">
										<input type="text" name="mapQueryEn" class="form-control" th:value="${card.mapQueryEn}"
											   placeholder="282 Sunhwagung-ro, Namyangju-si, Gyeonggi-do, Korea">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">홈페이지</label>
									<div class="col-sm-10">
										<input type="text" name="websiteUrl" class="form-control" th:value="${card.websiteUrl}"
											   placeholder="https://www.bionlifescience.com">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">카탈로그</label>
									<div class="col-sm-10">
										<input type="text" name="catalogUrl" class="form-control" th:value="${card.catalogUrl}"
											   placeholder="https://optomation.dev">
									</div>
									<div class="col-sm-5">
										<input type="text" name="catalogNoteKo" class="form-control" th:value="${card.catalogNoteKo}"
											   placeholder="광학 제품 카탈로그">
									</div>
									<div class="col-sm-5">
										<input type="text" name="catalogNoteEn" class="form-control" th:value="${card.catalogNoteEn}"
											   placeholder="Optical products catalog">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">얼굴 사진</label>
									<div class="col-sm-10">
										<img th:if="${card.photoRoad}" th:src="${card.photoRoad}" width="90" height="90"
											 style="border-radius:50%; object-fit:cover; margin-bottom:8px;">
										<input type="file" name="photoFile" accept=".jpg,.jpeg,.png">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">미리보기 그림</label>
									<div class="col-sm-10">
										<img th:if="${card.ogRoad}" th:src="${card.ogRoad}" width="180" style="margin-bottom:8px;">
										<input type="file" name="ogFile" accept=".jpg,.jpeg,.png">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">거래 서류 영역</label>
									<div class="col-sm-10">
										<label><input type="checkbox" name="showDocsYn" value="Y"
													  th:checked="${card.showDocsYn == 'Y'}"> 명함에 거래 서류 영역을 노출합니다</label>
										<input type="text" name="bizNo" class="form-control" th:value="${card.bizNo}"
											   placeholder="209-81-56186" style="margin-top:8px;">
									</div>
								</div>

								<div class="form-group">
									<label class="col-sm-2 control-label">QR 영역</label>
									<div class="col-sm-10">
										<label><input type="checkbox" name="showQrYn" value="Y"
													  th:checked="${card.showQrYn == 'Y'}"> 명함에 QR 영역을 노출합니다</label>
										<input type="text" name="qrUrl" class="form-control" th:value="${card.qrUrl}"
											   placeholder="https://bionlifescience.com/brandList/own/73" style="margin-top:8px;">
										<div th:if="${card.nameCardId != null and card.showQrYn == 'Y' and card.qrUrl != null and card.qrUrl != ''}" style="margin-top:8px;">
											<img th:src="@{/namecard/{slug}/qr.svg(slug=${card.slug})}" width="120" height="120">
										</div>
										<input type="text" name="qrCaptionKo" class="form-control" th:value="${card.qrCaptionKo}"
											   placeholder="Photonic Lattice · 편광·위상차 실시간 가시화" style="margin-top:8px;">
										<input type="text" name="qrCaptionEn" class="form-control" th:value="${card.qrCaptionEn}"
											   placeholder="Photonic Lattice · real-time birefringence imaging" style="margin-top:8px;">
									</div>
								</div>

								<div class="form-group">
									<div class="col-sm-offset-2 col-sm-10">
										<button type="submit" class="btn btn-theme">저장</button>
										<a class="btn btn-default" href="/admin/namecardManager">목록</a>
										<a th:if="${card.nameCardId != null}" class="btn btn-default"
										   th:href="'/' + ${card.slug}" target="_blank" rel="noopener">명함 열어보기</a>
									</div>
								</div>
							</form>
						</div>

						<!-- 거래 서류는 명함을 저장한 뒤에 올린다 -->
						<div class="form-panel" th:if="${card.nameCardId != null}">
							<h4><i class="fa fa-angle-right"></i> 거래 서류</h4>
							<div class="alert alert-warning" style="margin-top:10px;">
								명함은 링크를 아는 사람이면 누구나 여는 공개 페이지입니다. 통장사본·계좌정보·재무자료·신분증은 올릴 수 없습니다.
							</div>

							<form role="form" action="/admin/namecardManager/document" class="form-horizontal style-form"
								  method="POST" enctype="multipart/form-data">
								<input type="hidden" name="nameCardId" th:value="${card.nameCardId}">
								<div class="form-group">
									<label class="col-sm-2 control-label">서류 종류</label>
									<div class="col-sm-4">
										<select name="docType" class="form-control" required>
											<option value="">=== 종류를 선택하세요 ===</option>
											<option th:each="type : ${docTypes}" th:value="${type.name()}" th:text="${type.koLabel}"></option>
										</select>
									</div>
									<div class="col-sm-4">
										<input type="file" name="docFile" accept="application/pdf,.pdf" required>
									</div>
									<div class="col-sm-2">
										<button type="submit" class="btn btn-theme">서류 등록</button>
									</div>
								</div>
							</form>

							<div class="table-responsive">
								<table class="table table-bordered">
									<thead>
									<tr>
										<th style="width: 200px;">종류</th>
										<th>올린 파일명</th>
										<th style="width: 110px;">크기</th>
										<th style="width: 120px;">관리</th>
									</tr>
									</thead>
									<tbody>
										<tr th:if="${#lists.isEmpty(card.documents)}">
											<td colspan="4" class="text-center">등록된 서류가 없습니다.</td>
										</tr>
										<tr th:each="doc : ${card.documents}">
											<td th:text="${doc.koLabel}"></td>
											<td th:text="${doc.fileName}"></td>
											<td th:text="${doc.fileSize != null} ? ${#numbers.formatInteger(doc.fileSize / 1024, 0, 'COMMA')} + ' KB' : ''"></td>
											<td>
												<a class="btn btn-default btn-xs"
												   th:href="@{/namecard/{slug}/doc/{id}(slug=${card.slug},id=${doc.nameCardDocumentId})}"
												   target="_blank" rel="noopener">보기</a>
												<button type="button" class="btn btn-danger btn-xs"
														th:onclick="|deleteDocument('${doc.nameCardDocumentId}')|">삭제</button>
											</td>
										</tr>
									</tbody>
								</table>
							</div>
						</div>

					</div>
				</div>
			</section>
		</section>
	</section>

	<form id="docDeleteForm" method="post" action="/admin/namecardManager/document/delete">
		<input type="hidden" name="documentId" id="docDeleteId">
	</form>

	<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
	<script th:inline="javascript">
		var message = /*[[${message}]]*/ null;
		if (message) { alert(message); }

		function deleteDocument(id) {
			if (confirm('이 서류를 삭제하시겠습니까?')) {
				document.getElementById('docDeleteId').value = id;
				document.getElementById('docDeleteForm').submit();
			}
		}
	</script>
</body>

</html>

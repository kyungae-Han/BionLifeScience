<!DOCTYPE html>
<html lang="KO" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">
</head>

<body>

    <!-- 로그인 배경. 템플릿에 딸려 오던 사진 대신 회사 색으로 칠한다 -->
    <style>
        #login-page {
            min-height: 100vh;
            background-color: #0a2036;
            background-image:
                radial-gradient(900px 520px at 12% 8%, rgba(111, 185, 44, .30), transparent 60%),
                radial-gradient(760px 460px at 88% 14%, rgba(252, 207, 0, .18), transparent 55%),
                radial-gradient(1100px 720px at 72% 92%, rgba(0, 159, 232, .38), transparent 62%),
                linear-gradient(160deg, #0d2b45 0%, #0a2036 58%, #071726 100%);
        }
        #login-page .login-logo {
            padding-top: 90px;
            text-align: center;
        }
        #login-page .login-logo img {
            width: 150px;
            height: auto;
        }
        /* 로고가 위로 올라온 만큼 폼의 여백을 줄인다 */
        #login-page .form-login {
            margin-top: 28px;
        }
    </style>

    <div id="login-page">
        <div class="container">
            <div class="login-logo">
                <img src="/front/image/logo/bion-logo-white.png" alt="BiON Life Science">
            </div>
            <form class="form-login" th:action="@{/memberLogin}" method="POST">
                <h2 class="form-login-heading">관리자로그인</h2>
                <div class="login-wrap">
                    <input type="text" name="username" class="form-control" required="required" placeholder="아이디를 입력 해 주세요." autofocus>
                    <br>
                    <input type="password" class="form-control" name="password" required="required" placeholder="비밀번호를 입력 해 주세요.">
                    <label class="checkbox" style="margin-left:20px;">

                    </label>
                    <button class="btn btn-theme btn-block" type="submit"><i class="fa fa-lock"></i>로그인</button>
                    <hr>
                    <div class="alert alert-danger" role="alert" th:if="${param.error}">
			    		<p th:text="${param.exception}"># 없는 계정 입니다.</p>
			        </div>
                </div>
            </form>
        </div>
    </div>
    <th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
</body>

</html>

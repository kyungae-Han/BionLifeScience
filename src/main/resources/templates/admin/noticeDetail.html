<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin/common :: headMenu}"></head>


<body>
<section id="container">
  <th:block th:replace="~{fragments/admin/common :: headMenu}"></th:block>
  <th:block th:replace="~{fragments/admin/common :: sideMenu('notice')}"></th:block>

  <section id="main-content">
    <section class="wrapper">
      <div class="row mt">
        <div class="col-md-8">
          <div class="content-panel">
            <h4><i class="fa fa-angle-right"></i> 공지사항 상세페이지</h4>
            <p class="mb-none"># 하단의 버튼을 통해 공지사항 내용을 수정할 수 있습니다.</p>
            <hr>

            <div class="row mt">
              <div class="col-lg-12">
                <div class="form">
                  <form id="noticeUpdateForm" class="cmxform form-horizontal style-form" method="post" action="/admin/noticeUpdate">
                    <div class="form-group">
                      <label class="control-label col-lg-2"># 공지사항 제목</label>
                      <div class="col-lg-10">
                        <input class="form-control" type="text" name="subject" th:value="${notice.subject}" required />
                      </div>
                      <input type="hidden" th:value="${notice.id}" name="id">
                    </div>

                    <div class="form-group">
                      <label class="control-label col-lg-2"># 공지사항분류</label>
                      <div class="col-lg-10">
                        <select class="form-control" name="subjectId">
                          <option th:each="s:${subject}"
                                  th:value="${s.id}"
                                  th:text="${s.text}"
                                  th:selected="${s.id == notice.subjectId}">
                          </option>
                        </select>
                        <span class="alsert-message">* 공지사항의 분류를 작성할 수 있습니다.</span><br>
                        <span class="alsert-message">* 해당 공지사항의 분류로 사이트 접속자가 공지사항을 조회할 수 있습니다.</span>
                      </div>
                    </div>

                    <div class="form-group">
                      <label class="control-label col-lg-2"># 중요공지여부</label>
                      <div class="col-lg-10">
                        <select class="form-control" name="sign">
                          <option th:value="true"  th:selected="${notice.sign == true}">중요공지</option>
                          <option th:value="false" th:selected="${notice.sign == false}">일반공지</option>
                        </select>
                        <span class="alsert-message">* 공지사항은 최근 공지사항이 먼저 출력 됩니다.</span><br>
                        <span class="alsert-message">* 중요공지는 공지일과 무관하게 가장 상단에 출력 됩니다.</span>
                      </div>
                    </div>

                    <!-- 본문(에디터) -->
                    <div class="form-group">
                      <label class="control-label col-lg-2"># 공지사항</label>
                      <div class="col-lg-10">
                        <!-- 전송용: hidden에 최종 HTML을 담아 보냄 -->
                        <input type="hidden" id="content" name="content" th:value="${notice.content}">
                        <!-- 에디터 표시 영역 -->
                        <div id="editor"></div>
                        <span class="alsert-message">* 이미지 업로드 가능, 저장 시 본문 첫 이미지가 대표로 저장됩니다.</span>
                      </div>
                    </div>

                    <div class="form-group">
                      <div class="col-lg-offset-2 col-lg-10">
                        <button class="btn btn-theme" type="button" onclick="location.href='/admin/noticeManager'">확인</button>
                        <button class="btn btn-warning" type="submit">수정</button>
                        <button class="btn btn-danger" th:onclick="deleteNotice([[${notice.id}]])" type="button">삭제</button>
                      </div>
                    </div>
                  </form>
                </div>
              </div>
            </div>

            <hr>
          </div>
        </div>
      </div>
    </section>
  </section>
</section>

<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>

<!-- Toast UI Editor -->
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>

<script>
  (function () {
    // CSRF 메타가 있으면 자동 포함
    var CSRF = (document.querySelector('meta[name=\"_csrf\"]')||{}).content;
    var CSRF_HEADER = (document.querySelector('meta[name=\"_csrf_header\"]')||{}).content;

    // 초기값: hidden에 들어있는 기존 본문
    var initial = document.getElementById('content').value || '';

    // 에디터 생성
    var editor = new toastui.Editor({
      el: document.querySelector('#editor'),
      height: '420px',
      initialEditType: 'wysiwyg',
      previewStyle: 'vertical',
      initialValue: initial,
      hooks: {
        // 이미지 업로드 → 백엔드 /admin/notice/image
        addImageBlobHook: async function (blob, callback) {
          try {
            var fd = new FormData();
            fd.append('file', blob);
            var res = await fetch('/admin/notice/image', {
              method: 'POST',
              headers: CSRF_HEADER ? { [CSRF_HEADER]: CSRF } : {},
              body: fd
            });
            if (!res.ok) throw new Error('upload failed');
            var data = await res.json(); // {url: '/front/images/notice/xxx.png'}
            callback(data.url, blob.name);
          } catch (e) {
            alert('이미지 업로드에 실패했습니다.');
          }
        }
      }
    });

    var form = document.getElementById('noticeUpdateForm');
    var hidden = document.getElementById('content');
    

    // 제출 직전 검증 + 값 세팅
    form.addEventListener('submit', function (e) {
      var html = editor.getHTML().trim();
      var plain = editor.getMarkdown().replace(/\s+/g, '').trim(); // 실제 내용 유무

      if (!plain) {
        e.preventDefault();
        alert('공지사항 내용을 입력해 주세요.');
        return;
      }
      hidden.value = html; // 최종 본문 HTML 반영
    });
  })();
</script>

<script src="/administration/lib/noticeManager.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="KO" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">


</head>


<body>
	<section id="container">
		<th:block th:replace="~{fragments/admin/common :: topBar}"></th:block>
		<th:block th:replace="~{fragments/admin/common :: sideMenu('history')}"></th:block>
		<section id="main-content">
			<section class="wrapper">
				<div class="row mt">
					<form class="form-horizontal style-form" id="history-title-form" name="history-title-form">
						<div class="col-lg-6">
							<div class="form-panel">
								<div class="row">
									<div class="col-lg-12">
										<div class="form-group col-12 col-md-12 col-lg-12">
											<div class="col-md-5 col-xs-11">
												<input class="form-control form-control-inline" 
												name="start" 
												size="16"
												required="required"	
												id="start"
												type="text"> 
												<span class="help-block"># 연혁 시작년도를 입력 하세요</span>
											</div>
											<div class="col-md-5 col-xs-11">
												<input class="form-control form-control-inline"
												size="16" 
												required="required"
												id="end"
												type="text" 
												name="end"> 
												<span class="help-block"># 연혁 종료년도를 입력 하세요</span>
											</div>
											<div class="col-md-2" style="padding-left: 30px;">
												<button id="history-title-button" onclick="historySubjectInsert();" style="width: 100%;" type="button"
													class="btn btn-primary">등록</button>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
				<div class="row mt" id="history-subject-wrap">
					<form id="history-content-form" action="#" class="form-horizontal style-form" th:each="list:${list}" th:id="|history-content-form-${list.id}|">
						<div class="col-lg-6">
							<div class="form-panel h-700">
								<div class="row">
									<div class="col-lg-12">
										<div class="form-group col-12 col-md-12 col-lg-12">
											<div class="col-md-12 col-xs-11 history-title text-center">
												<span th:text="${list.start}">2014년 </span> ~ <span th:text="${list.end}"> 2017년</span>
											</div>
										</div>
										<!-- 등록칸. 한글이 윗줄, 영문이 아랫줄이다.
										     영문은 비워 둘 수 있다. 비우면 영문 화면에서 한글이 그대로 나간다. -->
										<div class="form-group col-12 col-md-12 col-lg-12">
											<div class="col-md-9 col-xs-11">
												<input class="form-control form-control-inline" size="16"
													type="text" th:id="|content-${list.id}|"> <span class="help-block">#
													연혁 내용을 입력 하세요</span>
											</div>
											<div class="col-md-3" style="padding-left: 5px;display:flex;">
												<button style="width: 100%;" type="button"
													class="btn btn-primary" th:onclick="|historyContentInsert(${list.id});|">등록</button>
												<button style="width: 100%;margin-left:5px;" type="button"
													class="btn btn-warning" th:onclick="|historyDelete(${list.id},1);|">삭제</button>
											</div>
										</div>
										<div class="form-group col-12 col-md-12 col-lg-12">
											<div class="col-md-9 col-xs-11">
												<input class="form-control form-control-inline" size="16"
													type="text" th:id="|content-en-${list.id}|"
													placeholder="English (optional)"> <span class="help-block">#
													영문 내용입니다. 비워 두면 영문 화면에서 한글이 나갑니다</span>
											</div>
											<div class="col-md-3 col-xs-11">
												<input type="date" th:id="|content-date-${list.id}|"
													class="form-control">
												<span class="help-block"># 연혁에 해당하는 날</span>
											</div>
										</div>
									</div>
								</div>
								<section class="task-panel tasks-widget no-shadow">
									<div class="panel-heading">
										<div class="pull-left">
											<h5>
												<i class="fa fa-tasks"></i> <span th:text="${list.start}">2011</span> ~ <span th:text="${list.end}">2013</span>
											</h5>
										</div>
										<br>
									</div>
									<div class="panel-body">
										<div class="task-content">
											<ul class="task-list">
												<!-- 연혁 한 건.
												     줄 사이 점선은 to-do.css 의 .task-list li 가 그린다. 그대로 둔다.
												     보기 모드와 고치기 모드를 둘 다 넣어 두고 JS 가 번갈아 보여 준다.
												     ⚠️ id 를 content.id 로 묶었다. 예전에는 li 의 id 가 list.id 라
												        한 해에 여러 건이 있으면 id 가 전부 같았다. -->
												<li th:each="content:${list.contents}" th:id="|history-item-${content.id}|">
													<div class="task-checkbox">
													</div>
													<div class="task-title">

														<!-- 보기 -->
														<div th:id="|history-view-${content.id}|">
															<div class="pull-right hidden-phone">
																<button class="btn btn-primary btn-xs" title="수정"
																	th:onclick="|historyEditOpen(${content.id});|">
																	<i class="fa fa-pencil"></i>
																</button>
																<button class="btn btn-danger btn-xs" title="삭제"
																	th:onclick="|historyDelete(${content.id},0);|">
																	<i class="fa fa-trash-o "></i>
																</button>
															</div>
															<span class="task-title-sp" th:text="${content.contentSubject}">연혁 내용이 입력되는 장소 입니다.</span>
															<span class="badge bg-theme" th:text="${content.historyDate}">2023.01.01</span>
															<div class="history-en" th:classappend="${content.contentSubjectEn} ? '' : 'is-empty'"
																th:text="${content.contentSubjectEn} ?: '— 영문 없음'">English</div>
														</div>

														<!-- 고치기 -->
														<div class="history-edit" th:id="|history-edit-${content.id}|" style="display:none;">
															<input type="text" class="form-control"
																th:id="|hist-ko-${content.id}|" th:value="${content.contentSubject}"
																placeholder="한글 내용">
															<input type="text" class="form-control"
																th:id="|hist-en-${content.id}|" th:value="${content.contentSubjectEn}"
																placeholder="English (optional)">
															<div class="history-edit__row">
																<input type="date" class="form-control"
																	th:id="|hist-date-${content.id}|" th:value="${content.historyDate}">
																<button type="button" class="btn btn-theme btn-sm"
																	th:onclick="|historyContentUpdate(${content.id});|">저장</button>
																<button type="button" class="btn btn-default btn-sm"
																	th:onclick="|historyEditClose(${content.id});|">취소</button>
															</div>
														</div>

													</div>
												</li>
											</ul>
										</div>
									</div>
								</section>
							</div>
						</div>
					</form>
				</div>
			</section>
		</section>
	</section>
	<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
	<script src="/administration/lib/historyManager.js"></script>
</body>

</html>

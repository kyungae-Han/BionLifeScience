<!DOCTYPE html>
<html lang="KO" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">


</head>

<style>
/* 지금 걸려 있는 이미지. 새 파일을 고르지 않으면 이것이 그대로 남는다 */
.cert-now {
	display: flex; align-items: flex-start; gap: 14px;
	padding: 12px; border: 1px solid var(--bn-line);
	border-radius: 6px; background: var(--bn-surface-2);
}
.cert-now img {
	width: 96px; height: 128px; object-fit: cover;
	border: 1px solid var(--bn-line); border-radius: 4px; background: var(--bn-surface);
}
.cert-now .none {
	width: 96px; height: 128px; display: flex; align-items: center; justify-content: center;
	border: 1px solid var(--bn-line); border-radius: 4px;
	background: var(--bn-surface); color: var(--bn-ink-4); font-size: 11px;
}
.cert-now .road { color: var(--bn-ink-3); font-size: 11.5px; word-break: break-all; }
</style>

<body>
	<section id="container">
		<th:block th:replace="~{fragments/admin/common :: topBar}"></th:block>
		<th:block th:replace="~{fragments/admin/common :: sideMenu('certification')}"></th:block>
		<section id="main-content">
			<section class="wrapper">
				<div class="row mt">
					<div class="col-lg-10">
						<h4><i class="fa fa-angle-right"></i> 인증서 수정</h4>
					</div>
				</div>
				<div class="row mt">
					<div class="col-lg-8">
						<div class="form-panel">
							<form action="/admin/certificationUpdate" method="POST" enctype="multipart/form-data" class="form-horizontal style-form">
								<input type="hidden" name="id" th:value="${certification.id}">
								<div class="row">
									<div class="form-group col-12 col-md-12 col-lg-12">

										<div class="col-md-12 col-xs-11">
											<label class="control-label">지금 걸려 있는 이미지</label>
											<div class="cert-now">
												<img th:if="${certification.road}" th:src="${certification.road}" th:alt="${certification.subject}">
												<span class="none" th:unless="${certification.road}">이미지 없음</span>
												<div>
													<span class="help-block"># 새 파일을 고르지 않으면 이 이미지가 그대로 남습니다.</span>
													<span class="road" th:text="${certification.road} ?: '경로 없음'">경로</span>
												</div>
											</div>
										</div>

										<div class="col-md-12 col-xs-11" style="margin-top:20px;">
											<input class="form-control form-control-inline"
											type="text"
											name="subject"
											th:value="${certification.subject}"
											required="required">
											<span class="help-block"># 인증서의 SUBJECT 문구를 입력 해 주세요.</span>
										</div>

										<div class="col-md-12 col-xs-11" style="margin-top:20px;">
											<input class="form-control form-control-inline"
											type="text"
											name="content"
											th:value="${certification.content}"
											required="required">
											<span class="help-block"># 인증서의 CONTENT 문구를 입력 해 주세요.</span>
										</div>

										<div class="col-md-12 col-xs-11" style="margin-top:20px;">
											<select class="form-control form-control-inline"
											name="sort"
											required="required">
												<option value="">=== 분류를 선택하세요 ===</option>
												<option value="특허인증" th:selected="${certification.sort == '특허인증'}">특허인증</option>
												<option value="기업인증" th:selected="${certification.sort == '기업인증'}">기업인증</option>
												<option value="기타인증" th:selected="${certification.sort == '기타인증'}">기타인증</option>
											</select>
											<span class="help-block"># 인증서의 분류를 선택 해 주세요.</span>
										</div>

										<div class="col-md-12 col-xs-11" style="margin-top:20px;">
											<div class="fileupload fileupload-new"
												data-provides="fileupload">
												<span class="btn btn-warning btn-file" style="width:100%;">
													<span class="fileupload-new"><i class="fa fa-paperclip"></i>Select file</span>
													<span class="fileupload-exists"><i class="fa fa-undo"></i> Change</span>
													<input
													type="file"
													class="default"
													name="webFile"
													id="webFile" />
												</span>
												<span class="fileupload-preview" style="margin-left: 5px;"></span>
												<a href="#" class="close fileupload-exists"
													data-dismiss="fileupload"
													style="float: none; margin-left: 5px;"></a>
											</div>
											<span class="help-block"># 이미지를 바꿀 때만 고르세요. 비워 두면 그대로 둡니다.</span>
											<span class="help-block"># 최적화된 사이즈는 420px * 600px 입니다.</span>
											<span class="help-block"># 파일은 jpeg/png/jpg 확장자를 지원 합니다.</span>
										</div>

										<div class="col-md-12 col-xs-11" style="margin-top:20px;">
											<button type="submit" class="btn btn-theme">수정</button>
										</div>
									</div>
								</div>
							</form>
						</div>
					</div>
				</div>
				<div class="row">
					<div class="col-lg-8">
						<div class="form-panel">
							<button type="button" class="btn btn-default"
								onclick="javascript:location.href='/admin/certificationManager'">목록으로</button>
						</div>
					</div>
				</div>
			</section>
		</section>
	</section>
	<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
	<script type="text/javascript"
		src="/administration/lib/bootstrap-fileupload/bootstrap-fileupload.js"></script>
	<script>
	$(function () {
		// 한 번에 올릴 수 있는 용량을 넘기면 서버까지 가지 않고 여기서 막는다
		$('#webFile').on('change', function (e) {
			var size = 0;
			for (var i = 0; i < e.target.files.length; i++) {
				size += e.target.files[i].size;
			}
			if (size > 30000000) {
				alert('1회 업로드 가능 용량은 30MB입니다.');
				$(this).val('');
			}
		});
	});
	</script>
</body>

</html>

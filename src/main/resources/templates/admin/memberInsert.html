<!DOCTYPE html>
<html lang="KO" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">
</head>


<body>

<section id="container">
	<th:block th:replace="~{fragments/admin/common :: headMenu}"></th:block>
	<th:block th:replace="~{fragments/admin/common :: sideMenu('index')}"></th:block>
	<section id="main-content">
		<section class="wrapper">
			<div class="row mt">
				<div class="col-lg-8">			
				 <h4>멤버 등록</h4>
					<div class="form-panel">
						  <form th:action="@{/admin/memberInsert}" class="form-horizontal style-form" method="post"  th:object="${member}">
						  	<div class="form-group">
							    <label for="UserName" class="col-lg-2 control-label">아이디</label>
							    <div class="col-lg-10">
							    	<input class="form-control"  id="UserName" type="text" th:field="*{username}" required>
							    </div>
						    </div>
							<div class="form-group">
							    <label for="Password" class="col-lg-2 control-label">비밀번호</label>
							    <div class="col-lg-10">
							    	<input class="form-control"  id="Password" type="password" th:field="*{password}" required>
							    </div>
							</div>
							<div class="form-group">
							    <label for="Name" class="col-lg-2 control-label">이름</label>
							    <div class="col-lg-10">
							    	<input class="form-control"  id="Name" type="text" th:field="*{name}">
							    </div>
							</div>
							<div class="form-group">
							    <label for="Email" class="col-lg-2 control-label">이메일</label>
							    <div class="col-lg-10">
							    	<input class="form-control"  id="Email" type="email" th:field="*{email}">
							    </div>
							</div>    
							<div class="form-group">
							    <label for="Phone" class="col-lg-2 control-label">전화번호</label>
							    <div class="col-lg-10">
							    	<input id="Phone" class="form-control" type="text" th:field="*{phone}" placeholder="010-1234-5678">
							    </div>
							</div>
							<div class="form-group">
							    <label class="col-lg-2 control-label">권한</label>
							    <div class="col-lg-10">
								    <select class="form-control"  th:field="*{role}">
								      <option value="ROLE_USER" selected>일반회원</option>
								      <option value="ROLE_ADMIN" selected>관리자</option>
								    </select>
							    </div>
							</div>    
							
							<div class="form-group pb-3">
							  <div class="col-lg-12 text-center">
							    <button type="submit" class="btn btn-theme">등록</button>
							  </div>
							</div>
						  </form>
					 </div>
				</div>
			</div>
		</section>
	</section>			  
 </section> 
 	<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
	<script src="/administration/lib/search.js" type="text/javascript"></script>
</body>
</html>

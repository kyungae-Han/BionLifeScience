<!DOCTYPE html>
<html lang="KO" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">


</head>


<style>
/* 인증서 목록. 예전에는 한 건이 화면 한 폭을 차지해서 몇 개 있는지도 안 보였다.
   줄 하나에 한 건씩 놓고, 이미지는 작은 미리보기로 줄인다. */
.cert-table td { vertical-align: middle; }
.cert-thumb {
	width: 72px; height: 96px; object-fit: cover;
	border: 1px solid var(--bn-line); border-radius: 4px; background: var(--bn-surface-2);
}
.cert-subject { font-weight: 600; color: var(--bn-ink); }
.cert-content { color: var(--bn-ink-2); line-height: 1.6; }
.cert-none { text-align: center; color: var(--bn-ink-4); padding: 28px 0 !important; }
</style>

<body>
	<section id="container">
		<th:block th:replace="~{fragments/admin/common :: topBar}"></th:block>
		<th:block th:replace="~{fragments/admin/common :: sideMenu('certification')}"></th:block>
		<section id="main-content">
			<section class="wrapper">
				<div class="row mt">
					<div class="col-md-8">
						<div class="content-panel">
							<h5><i class="fa fa-tasks"></i> 바이온라이프사이언스 - 인증서 관리</h5>

							<!-- 등록 버튼 줄. 배너·브랜드·제품 관리와 같은 자리다 -->
							<div class="prod-filter-foot">
								<button class="btn btn-default" type="button"
									onclick="javascript:location.href='/admin/certificationInsertForm'">새로운 인증서 등록</button>
							</div>

							<p class="bn-help">
								줄 맨 앞을 잡고 끌어서 순서를 바꾼다. 놓는 순간 저장된다.
								회사소개의 인증서 페이지도 이 순서를 따라간다.
							</p>

							<table class="table table-hover cert-table">
								<thead>
									<tr>
										<th style="width:34px;"></th>
										<th style="width:44px;">순서</th>
										<th style="width:96px;">미리보기</th>
										<th style="width:96px;">분류</th>
										<th style="width:220px;">SUBJECT</th>
										<th>CONTENT</th>
										<th style="width:136px;">관리</th>
									</tr>
								</thead>
								<tbody id="certRows">
									<tr th:each="b:${certifications}" th:data-id="${b.id}">
										<td class="bn-grip" title="끌어서 순서 바꾸기"><i class="fa fa-bars"></i></td>
										<td><span class="bn-index" th:text="${b.certificationIndex}">1</span></td>
										<td><img class="cert-thumb" th:src="${b.road}" th:alt="${b.subject}"></td>
										<td><span class="label label-default" th:text="${b.sort} ?: '분류 없음'">분류</span></td>
										<td class="cert-subject" th:text="${b.subject}">제목</td>
										<td class="cert-content" th:text="${b.content}">내용</td>
										<td>
											<button class="btn btn-primary btn-xs" type="button"
												th:onclick="|location.href='/admin/certificationUpdateForm/${b.id}'|">
												<i class="fa fa-pencil"></i> 수정
											</button>
											<button class="btn btn-danger btn-xs" type="button" th:onclick="|deleteCertification('${b.id}')|">
												<i class="fa fa-trash-o"></i> 삭제
											</button>
										</td>
									</tr>
									<tr th:if="${#lists.isEmpty(certifications)}">
										<td colspan="7" class="cert-none">등록된 인증서가 없다.</td>
									</tr>
								</tbody>
							</table>
						</div>
					</div>
				</div>
			</section>
		</section>
	</section>
	<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
	<script src="/administration/lib/jquery-ui-1.9.2.custom.min.js"></script>
	<script type="text/javascript"
		src="/administration/lib/bootstrap-fileupload/bootstrap-fileupload.js"></script>
<script>
$(function () {
	// 줄을 끌어서 순서를 바꾼다. 손잡이를 잡아야만 끌린다.
	// 표 전체를 잡히게 하면 단추를 누르다가도 끌려서 못 쓴다.
	$('#certRows').sortable({
		handle: '.bn-grip',
		axis: 'y',
		placeholder: 'bn-placeholder',
		helper: function (e, tr) {
			// 끌 때 칸 너비가 무너지지 않게 원래 너비를 박아 둔다
			var originals = tr.children();
			var helper = tr.clone();
			helper.children().each(function (i) { $(this).width(originals.eq(i).width()); });
			return helper;
		},
		update: function () {
			var ids = $('#certRows tr[data-id]').map(function () {
				return $(this).data('id');
			}).get();

			$.post('/admin/certificationOrder', { ids: ids })
				.done(function () {
					// 화면의 순서 번호도 다시 매긴다. 새로고침하지 않아도 맞게 보인다
					$('#certRows tr[data-id] .bn-index').each(function (i) {
						$(this).text(i + 1);
					});
				})
				.fail(function () {
					alert('순서를 저장하지 못했다. 새로고침하고 다시 해 주세요.');
					location.reload();
				});
		}
	});
});

function deleteCertification(id) {
	var result = confirm('해당 인증서를 삭제 하시겠습니까?');
	if (result) {
		location.href = "/admin/deleteCertification/" + id;
	}
}
</script>
</body>

</html>

<!DOCTYPE html>
<html lang="KO" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">
</head>

<body>

<section id="container">
	<th:block th:replace="~{fragments/admin/common :: topBar}"></th:block>
	<th:block th:replace="~{fragments/admin/common :: sideMenu('member')}"></th:block>
	<section id="main-content">
		<section class="wrapper">
		 <div class="row mt">
	        <div class="col-lg-10">
	          <h4>등록된 계정 목록</h4>
	          <div class="alert alert-warning" th:if="${msg}" th:text="${msg}">안내</div>
	          <div class="content-panel">
	            <!-- 등록 버튼 줄. 다른 목록 화면과 같은 자리다 -->
	            <div class="prod-filter-foot">
	              <button class="btn btn-default" type="button"
	                onclick="javascript:location.href='/admin/memberInsert'">새 계정 등록</button>
	            </div>
	            <table class="table table-hover">
	              <thead>
	                <tr>
	                  <th style="width:48px;">No</th>
	                  <th>아이디</th>
	                  <th>이름</th>
	                  <th>이메일</th>
	                  <th>전화번호</th>
	                  <th style="width:84px;">권한</th>
	                  <th>사용 메뉴</th>
	                  <th style="width:70px;">활성화</th>
	                  <th style="width:120px;">관리</th>
	                </tr>
	              </thead>
	              <tbody>
	                <tr th:each="m, stat : ${members}" th:with="ms=${memberMenus.get(m.id)}">
	                  <td th:text="${stat.count}"></td>
	                  <td th:text="${m.username}"></td>
	                  <td th:text="${m.name}"></td>
	                  <td th:text="${m.email}"></td>
	                  <td th:text="${m.phone}"></td>
	                  <td th:text="${m.role == 'ROLE_ADMIN' ? '관리자' : '일반회원'}"></td>
	                  <td>
	                    <span class="menu-tag all" th:if="${m.role == 'ROLE_ADMIN'}">전체</span>
	                    <th:block th:unless="${m.role == 'ROLE_ADMIN'}">
	                      <span class="menu-tag" th:each="x : ${ms}" th:text="${x.label}">메뉴</span>
	                      <span class="menu-tag none" th:if="${ms == null or #lists.isEmpty(ms)}">없음. 로그인해도 쓸 메뉴가 없습니다</span>
	                    </th:block>
	                  </td>
	                  <td th:text="${m.enabled ? '활성' : '비활성'}"></td>
	                  <td>
	                    <a th:href="@{'/admin/memberEdit/' + ${m.id}}" class="btn btn-primary btn-xs">수정</a>
	                    <a th:href="@{'/admin/memberDelete/' + ${m.id}}"
	                       class="btn btn-danger btn-xs"
	                       onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
	                  </td>
	                </tr>
	              </tbody>
	            </table>
	          </div>
	        </div>
	      </div>
		</section>
	</section>
</section>

<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
<script src="/administration/lib/search.js" type="text/javascript"></script>
</body>
</html>

 <!DOCTYPE html>
<html lang="KO" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">
</head>

<body>

<section id="container">
	<th:block th:replace="~{fragments/admin/common :: headMenu}"></th:block>
	<th:block th:replace="~{fragments/admin/common :: sideMenu('index')}"></th:block>
	<section id="main-content">
		<section class="wrapper">
		 <div class="row mt">
	        <div class="col-lg-10">
	          <h4>등록된 멤버 목록</h4>
	          <div class="content-panel">
	            <table class="table table-striped table-advance table-hover">
	              <thead>
	                <tr>
	                  <th>No</th>
	                  <th>아이디</th>
	                  <th>이름</th>
	                  <th>이메일</th>
	                  <th>전화번호</th>
	                  <th>권한</th>
	                  <th>활성화</th>
	                  <th>삭제</th>
	                </tr>
	              </thead>
	              <tbody>
	                <tr th:each="m, stat : ${members}">
	                  <td th:text="${stat.count}"></td>
	                  <td th:text="${m.username}"></td>
	                  <td th:text="${m.name}"></td>
	                  <td th:text="${m.email}"></td>
	                  <td th:text="${m.phone}"></td>
	                  <td th:text="${m.role == 'ROLE_ADMIN' ? '관리자' : '일반회원'}"></td>
	                  <td th:text="${m.enabled ? '활성' : '비활성'}"></td>
	                  <td>
	                    <a th:href="@{'/admin/memberDelete/' + ${m.id}}"
	                       class="btn btn-danger btn-xs"
	                       onclick="return confirm('정말 삭제하시겠습니까?');">삭제</a>
	                  </td>
	                </tr>
	              </tbody>
	            </table>
	          </div>
	        </div>
	      </div>
		</section>
	</section>
</section>     

<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
<script src="/administration/lib/search.js" type="text/javascript"></script> 
</body>
</html>

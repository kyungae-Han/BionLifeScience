<!DOCTYPE html>
<html lang="KO" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">
</head>

<style>
/* 배너 목록. 색과 간격은 bion-admin.css 의 이름을 쓴다 */

/* 칸 너비를 th 에 적은 대로 지킨다.
   그냥 두면 이미지가 있는 칸이 324px 까지 퍼지고 제목이 91px 로 눌린다 */
.bn-table { table-layout: fixed; width: 100%; }

/* 그래도 좁아지면 표만 가로로 밀린다. 카드가 깨지지 않는다 */
.bn-wrap { overflow-x: auto; }
.bn-table td { vertical-align: middle; }

/* 긴 글은 세 줄에서 자른다. 목록은 훑어보는 자리라 전문이 필요 없다 */
.bn-text .ko,
.bn-text .en {
	display: -webkit-box;
	-webkit-line-clamp: 3;
	-webkit-box-orient: vertical;
	overflow: hidden;
}

/* 끄는 중인 줄은 흐리게. 다만 글씨는 읽을 수 있게 남긴다 */
.bn-table tr.bn-off td:not(:last-child) { opacity: .45; }

/* 한글 위, 영문 아래 */
.bn-text .ko { color: var(--bn-ink); font-size: 13px; line-height: 1.5; }
.bn-text .en { margin-top: 3px; color: var(--bn-ink-3); font-size: 12px; line-height: 1.5; }
.bn-text .en.none { color: var(--bn-ink-4); font-style: normal; }
.bn-text br { display: none; }   /* 제목에 들어 있는 줄바꿈 태그가 표를 늘린다 */

/* 칸 너비에서 좌우 여백(12px씩)을 뺀 만큼만 차지한다.
   더 크면 자기 칸을 넘어 옆 칸 위로 올라간다 */
.bn-thumb {
	display: block; width: 104px; height: 58px;
	object-fit: cover; border-radius: 5px;
	border: 1px solid var(--bn-line); background: var(--bn-surface-2);
}

.bn-thumb.mobile { width: 56px; height: 78px; }

.bn-thumb.none {
	display: flex; align-items: center; justify-content: center;
	font-size: 11px; color: var(--bn-ink-4);
}

/* 넘치면 옆 칸을 밀고 나가지 말고 아래로 접히게 한다.
   table-layout:fixed 라 칸은 안 늘어나고 내용만 삐져나가기 때문이다 */
.bn-period { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.bn-period input[type="date"] { flex: 0 1 104px; min-width: 96px; height: 30px; font-size: 12px; padding: 0 4px; }
.bn-period .tilde { color: var(--bn-ink-4); }
.bn-period .btn { flex: none; }

/* 켜기/끄기 스위치 */
.bn-switch {
	position: relative; width: 40px; height: 22px; padding: 0;
	border: 0; border-radius: 20px; background: var(--bn-line-2);
	cursor: pointer; transition: background .15s ease;
}

.bn-switch.on { background: var(--bn-ok); }

.bn-switch .knob {
	position: absolute; top: 3px; left: 3px;
	width: 16px; height: 16px; border-radius: 50%;
	background: #fff; box-shadow: 0 1px 2px rgba(27, 34, 48, .3);
	transition: left .15s ease;
}

.bn-switch.on .knob { left: 21px; }

.bn-none { padding: 26px 0; text-align: center; color: var(--bn-ink-4); }

</style>

<body>
	<section id="container">
		<th:block th:replace="~{fragments/admin/common :: topBar}"></th:block>
		<th:block th:replace="~{fragments/admin/common :: sideMenu('site')}"></th:block>
		<section id="main-content">
			<section class="wrapper">
				<div class="row mt">
					<div class="col-md-8">
						<div class="content-panel">
							<h5><i class="fa fa-tasks"></i> 바이온라이프사이언스 - 메인 배너관리</h5>

							<!-- 등록 버튼 줄. 브랜드·제품 관리와 같은 자리다 -->
							<div class="prod-filter-foot">
								<button class="btn btn-default" type="button"
									onclick="javascript:location.href='/admin/bannerInsertForm'">새로운 배너 등록</button>
							</div>

							<p class="bn-help">
								줄 맨 앞을 잡고 끌어서 순서를 바꾼다. 놓는 순간 저장된다.
								꺼져 있거나 기간이 지난 배너는 메인에 나가지 않는다.
							</p>

							<div class="bn-wrap">
							<table class="table table-hover bn-table">
								<thead>
									<tr>
										<th style="width:34px;"></th>
										<th style="width:44px;">순서</th>
										<th style="width:184px;">배너 제목</th>
										<th>배너 내용</th>
										<th style="width:136px;">PC 배너</th>
										<th style="width:84px;">모바일</th>
										<th style="width:262px;">노출 기간</th>
										<th style="width:62px;">사용</th>
										<th style="width:136px;">관리</th>
									</tr>
								</thead>
								<tbody id="bannerRows">
									<tr th:each="b:${banners}" th:data-id="${b.id}"
										th:classappend="${b.on} ? '' : 'bn-off'">

										<td class="bn-grip" title="끌어서 순서 바꾸기"><i class="fa fa-bars"></i></td>

										<td><span class="bn-index" th:text="${b.bannerIndex}">1</span></td>

										<!-- 제목: 한글 위, 영문 아래 -->
										<td class="bn-text">
											<span class="ko" th:utext="${b.subject}">제목</span>
											<span class="en" th:if="${!b.missingSubjectEn}" th:utext="${b.subjectEn}">English</span>
											<span class="en none" th:if="${b.missingSubjectEn}">영문 없음</span>
										</td>

										<!-- 내용: 한글 위, 영문 아래 -->
										<td class="bn-text">
											<span class="ko" th:utext="${b.content}">내용</span>
											<span class="en" th:if="${!b.missingContentEn}" th:utext="${b.contentEn}">English</span>
											<span class="en none" th:if="${b.missingContentEn}">영문 없음</span>
										</td>

										<!-- PC 배너 -->
										<td>
											<img class="bn-thumb"
												th:if="${!#strings.isEmpty(b.webroad) and !(
															#strings.endsWith(#strings.toLowerCase(b.webroad), '.mp4') or
															#strings.endsWith(#strings.toLowerCase(b.webroad), '.mov'))}"
												th:src="${b.webroad + '?v=' + timestamp}" alt="PC 배너">
											<video class="bn-thumb" muted loop autoplay playsinline preload="metadata"
												th:if="${!#strings.isEmpty(b.webroad) and (
															#strings.endsWith(#strings.toLowerCase(b.webroad), '.mp4') or
															#strings.endsWith(#strings.toLowerCase(b.webroad), '.mov'))}">
												<source th:src="${b.webroad}" type="video/mp4">
											</video>
											<span class="bn-thumb none" th:if="${#strings.isEmpty(b.webroad)}">없음</span>
										</td>

										<!-- 모바일 배너 -->
										<td>
											<img class="bn-thumb mobile"
												th:if="${!#strings.isEmpty(b.mobileroad) and !(
															#strings.endsWith(#strings.toLowerCase(b.mobileroad), '.mp4') or
															#strings.endsWith(#strings.toLowerCase(b.mobileroad), '.mov'))}"
												th:src="${b.mobileroad + '?v=' + timestamp}" alt="모바일 배너">
											<video class="bn-thumb mobile" muted loop autoplay playsinline preload="metadata"
												th:if="${!#strings.isEmpty(b.mobileroad) and (
															#strings.endsWith(#strings.toLowerCase(b.mobileroad), '.mp4') or
															#strings.endsWith(#strings.toLowerCase(b.mobileroad), '.mov'))}">
												<source th:src="${b.mobileroad}" type="video/mp4">
											</video>
											<span class="bn-thumb mobile none" th:if="${#strings.isEmpty(b.mobileroad)}">없음</span>
										</td>

										<!-- 노출 기간. 비우고 저장하면 제한이 없어진다 -->
										<td>
											<form method="post" th:action="@{/admin/bannerPeriod/{id}(id=${b.id})}" class="bn-period">
												<input type="date" name="startDate" th:value="${b.startDate}">
												<span class="tilde">~</span>
												<input type="date" name="endDate" th:value="${b.endDate}">
												<button type="submit" class="btn btn-default btn-xs">저장</button>
											</form>
										</td>

										<!-- 사용 여부 -->
										<td>
											<form method="post" th:action="@{/admin/bannerUse/{id}(id=${b.id})}">
												<input type="hidden" name="on" th:value="${!b.on}">
												<button type="submit" class="bn-switch"
													th:classappend="${b.on} ? 'on' : ''"
													th:title="${b.on} ? '누르면 끈다' : '누르면 켠다'">
													<span class="knob"></span>
												</button>
											</form>
										</td>

										<td>
											<button class="btn btn-primary btn-xs" th:onclick="|openBannerEditModal('${b.id}')|">
												<i class="fa fa-pencil"></i> 수정
											</button>
											<button class="btn btn-danger btn-xs" th:onclick="|deleteBanner('${b.id}')|">
												<i class="fa fa-trash-o"></i>
											</button>
										</td>
									</tr>

									<tr th:if="${#lists.isEmpty(banners)}">
										<td colspan="9" class="bn-none">등록된 배너가 없다.</td>
									</tr>
								</tbody>
							</table>
							</div>
						</div>
					</div>
				</div>
			</section>
		</section>
	</section>
	
	
	<!-- 🔽 수정 모달 -->
<div class="modal fade" id="bannerEditModal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">
      <div class="modal-header" style="display:flex; justify-content: flex-start; position: relative; padding: 20px 20px;">
        <h4 class="modal-title">배너 수정</h4>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); color: #fff;">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <div class="modal-body">
        <form id="bannerEditForm" method="post" enctype="multipart/form-data">
          <input type="hidden" name="id" id="editBannerId">

          <div class="form-group">
            <label>Subject</label>
            <textarea class="form-control" name="subject" id="editBannerSubject" required></textarea>
          </div>

          <div class="form-group">
            <label>Subject (English)</label>
            <textarea class="form-control" name="subjectEn" id="editBannerSubjectEn"
                      placeholder="비우면 영문 화면에도 한글이 나갑니다"></textarea>
          </div>

          <div class="form-group">
            <label>Content</label>
            <textarea class="form-control" name="content" id="editBannerContent" required></textarea>
          </div>

          <div class="form-group">
            <label>Content (English)</label>
            <textarea class="form-control" name="contentEn" id="editBannerContentEn"
                      placeholder="비우면 영문 화면에도 한글이 나갑니다"></textarea>
          </div>

		<div class="form-group" style="margin-top:20px;">
			<label class="control-label">링크등록</label>
			<input 
				type="text"
				class="form-control"
				name="linkUrl"
				id="editBannerLinkUrl"
				placeholder="hppts://example.com" />
			<span class="help-block"># 배너 클릭 시 이동할 링크를 입력하세요. (미입력시 이동 없음)</span>
		</div>
		
		<div class="form-group" style="margin-top:20px;">
			<label class="control-label">정렬순서</label>
			 <input 
			 type="number" 
			 class="form-control"
			 name="bannerIndex"
			 id="editBannerIndex">
		</div>

          <div class="row">
            <div class="col-md-6">
              <label>PC용 파일 변경</label>
              <input type="file" name="webFile" class="form-control" id="editWebFile" />
              <div id="previewWeb" style="margin-top:10px;"></div>
            </div>

            <div class="col-md-6">
              <label>모바일용 파일 변경</label>
              <input type="file" name="mobileFile" class="form-control" id="editMobileFile" />
              <div id="previewMobile" style="margin-top:10px;"></div>
            </div>
          </div>
        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">닫기</button>
        <button type="button" class="btn btn-success" id="saveBannerBtn">수정 완료</button>
      </div>
    </div>
  </div>
</div>
	
	
	<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
	<script src="/administration/lib/jquery-ui-1.9.2.custom.min.js"></script>
	<script type="text/javascript"
		src="/administration/lib/bootstrap-fileupload/bootstrap-fileupload.js"></script>
<script>
	$(function(){
		
		$("#file").on('change', function (e) {
	    	var size = 0;
	    	for(var i=0;i<e.target.files.length;i++){
	    		size += e.target.files[i].size;
	    	}
	    	if(size > 30000000){
	    		alert('1회 업로드 가능 용량은 30MB입니다.');
	    		$(this).val('');
	    		return;
	    	}
	    });

	});
	function deleteBanner(id){
		var result = confirm('해당 배너 세트를 삭제 하시겠습니까?');
		if(result){
			location.href="/admin/deleteBanner/" + id;
		}
	}
	
	let bannerId = null; 
	
	  // 🔹 수정 모달 열기 함수
	  function openBannerEditModal(id) {

		  bannerId = id;
		  
	    $.ajax({
	      url: '/admin/getBanner/' + id,
	      type: 'GET',
	      success: function (banner) {
	        // 데이터 주입
	        $('#editBannerId').val(banner.id);
	        $('#editBannerSubject').val(banner.subject);
	        $('#editBannerContent').val(banner.content);
	        $('#editBannerSubjectEn').val(banner.subjectEn);
	        $('#editBannerContentEn').val(banner.contentEn);
	        $('#editBannerLinkUrl').val(banner.linkUrl);
	        $('#editBannerIndex').val(banner.bannerIndex)

	        // 미리보기 초기화
	        $('#previewWeb').empty();
	        $('#previewMobile').empty();

	        // PC용 미리보기
	        if (banner.webroad) {
	          if (banner.webroad.endsWith('.mp4')) {
	            $('#previewWeb').html(`<video width="200" controls><source src="${banner.webroad}" type="video/mp4"></video>`);
	          } else {
	            $('#previewWeb').html(`<img src="${banner.webroad}" width="200" />`);
	          }
	        }

	        // 모바일용 미리보기
	        if (banner.mobileroad) {
	          if (banner.mobileroad.endsWith('.mp4')) {
	            $('#previewMobile').html(`<video width="200" controls><source src="${banner.mobileroad}" type="video/mp4"></video>`);
	          } else {
	            $('#previewMobile').html(`<img src="${banner.mobileroad}" width="200" />`);
	          }
	        }

	        // 모달 표시
	        $('#bannerEditModal').modal('show');
	      },
	      error: function () {
	        alert('배너 정보를 불러오지 못했습니다.');
	      }
	    });
	  }

	  // 🔹 수정 저장 버튼 클릭 시
	  $('#saveBannerBtn').on('click', function () {
	    let formData = new FormData($('#bannerEditForm')[0]);

	    $.ajax({
		  url: '/admin/bannerUpdate/' + bannerId,
		  type: 'POST',
		  data: formData,
		  processData: false,
		  contentType: false,
		  success: function(res) {
		    alert('수정 완료되었습니다.');
		    location.reload();
		  },
		  error: function(err) {
		    alert('수정 중 오류가 발생했습니다.');
		  }
		});
	  });

	
	 
	</script>
<script>
$(function () {
	// 줄을 끌어서 순서를 바꾼다. 손잡이를 잡아야만 끌린다.
	// 표 전체를 잡히게 하면 날짜 칸을 누르다가도 끌려서 못 쓴다.
	$('#bannerRows').sortable({
		handle: '.bn-grip',
		axis: 'y',
		placeholder: 'bn-placeholder',
		helper: function (e, tr) {
			// 끌 때 칸 너비가 무너지지 않게 원래 너비를 박아 둔다
			var originals = tr.children();
			var helper = tr.clone();
			helper.children().each(function (i) { $(this).width(originals.eq(i).width()); });
			return helper;
		},
		update: function () {
			var ids = $('#bannerRows tr[data-id]').map(function () {
				return $(this).data('id');
			}).get();

			$.post('/admin/bannerOrder', { ids: ids })
				.done(function () {
					// 화면의 순서 번호도 다시 매긴다. 새로고침하지 않아도 맞게 보인다
					$('#bannerRows tr[data-id] .bn-index').each(function (i) {
						$(this).text(i + 1);
					});
				})
				.fail(function () {
					alert('순서를 저장하지 못했다. 새로고침하고 다시 해 주세요.');
					location.reload();
				});
		}
	});
});
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">



<head th:replace="~{fragments/admin/common :: headMenu}">
</head>


<body>
	<section id="container">

		<th:block th:replace="~{fragments/admin/common :: headMenu}"></th:block>

		<th:block th:replace="~{fragments/admin/common :: sideMenu('pageManager')}"></th:block>

		<section id="main-content">
			<section class="wrapper">
				<div class="btn_group">
					<button class="btn btn-blue" type="button" style="margin-top: 10px;" 
											onclick="javascript:location.href='/admin/pageManager/form'">페이지 등록</button>
				</div>
				<div class="row mt">
					<div class="col-md-12">
						<div class="content-panel">
							<div class="row search-section">
								<div class="col-md-12">
									<h6>
										<i class="fas fa-question-circle"></i> 기본 검색조건 설정
									</h6>
									
									 <form th:action="@{/admin/pageManager}" method="get" class="mb-4">
								        <div class="d-flex align-items-center filter-wrap">
								            <label for="groupId" class="form-label mb-0">그룹 선택</label>
								            <select name="groupId" id="groupId" class="form-select" style="width: 260px;" onchange="this.form.submit()">
								                <option value="" th:selected="${groupId == null}">전체</option>
								                <option th:each="group : ${groupList}"
								                        th:value="${group.pageGroupId}"
								                        th:text="${group.groupName} + ' (' + ${group.basePath} + ')'"
								                        th:selected="${groupId != null and groupId == group.pageGroupId}">
								                </option>
								            </select>
								        </div>
								    </form>
								</div>
							</div>
							
							
									<div class="card">
								        <div class="card-body">
								            <div class="table-responsive">
								                <table class="table table-bordered table-hover align-middle mb-0">
								                    <thead class="table-light">
								                    <tr>
								                        <th style="width: 80px;">ID</th>
								                        <th style="width: 180px;">그룹명</th>
								                        <th style="width: 140px;">basePath</th>
								                        <th>페이지명</th>
								                        <th>서브명</th>
								                        <th style="width: 160px;">slug</th>
								                        <th style="width: 90px;">순서</th>
								                        <th style="width: 90px;">사용여부</th>
								                        <th style="width: 180px;">등록일</th>
								                        <th style="width: 120px;">관리</th>
								                    </tr>
								                    </thead>
								                    
								                    
								                    <tbody>
									                    <tr th:if="${#lists.isEmpty(pageList)}">
									                        <td colspan="10" class="text-center py-4">등록된 데이터가 없습니다.</td>
									                    </tr>
									                    
									                    <tr th:each="page : ${pageList}">
														    <td th:text="${page.pageContentId}"></td>
														    <td th:text="${page.pageGroup.groupName}"></td>
														    <td th:text="${page.pageGroup.basePath}"></td>
														    <td th:text="${page.pageName}"></td>
														    <td th:text="${page.pageSubName}"></td>
														    <td th:text="${page.slug}"></td>
														    <td th:text="${page.pageIndex}"></td>
														
														    <td>
														        <span th:if="${page.useYn == 'Y'}">사용</span>
														        <span th:if="${page.useYn != 'Y'}">미사용</span>
														    </td>
														
														    <td th:text="${#temporals.format(page.createdAt,'yyyy-MM-dd HH:mm')}"></td>
														    <td th:text="${#temporals.format(page.updatedAt,'yyyy-MM-dd HH:mm')}"></td>
														
														    <td>
														        <a class="btn btn-danger" th:href="@{/admin/pageManager/form/{id}(id=${page.pageContentId})}">수정</a>
														    </td>
														</tr>
								                    </tbody>
								                </table>
								            </div>
								        </div>
								    </div>
						</div>
					</div>
				</div>
			</section>
		</section>
	</section>
	
	
	<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
</body>

</html>

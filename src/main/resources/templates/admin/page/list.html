<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">



<head th:replace="~{fragments/admin/common :: headMenu}">
</head>


<body>
	<section id="container">

		<th:block th:replace="~{fragments/admin/common :: topBar}"></th:block>

		<th:block th:replace="~{fragments/admin/common :: sideMenu('site')}"></th:block>

		<section id="main-content">
			<section class="wrapper">
				<div class="btn_group">
					<button class="btn btn-blue" type="button" style="margin-top: 10px;" 
											onclick="javascript:location.href='/admin/pageManager/form'">페이지 등록</button>
				</div>
				<div class="row mt">
					<div class="col-md-12">
						<div class="alert alert-warning" th:if="${message}" th:text="${message}">안내</div>
						<div class="content-panel">
							<div class="row search-section">
								<div class="col-md-12">
									<h6>
										<i class="fa fa-question-circle"></i> 기본 검색조건 설정
									</h6>
									
									 <form th:action="@{/admin/pageManager}" method="get" class="mb-4">
								        <div class="d-flex align-items-center filter-wrap">
								            <label for="groupId" class="form-label mb-0">그룹 선택</label>
								            <select name="groupId" id="groupId" class="form-select" style="width: 260px;" onchange="this.form.submit()">
								                <option value="" th:selected="${groupId == null}">전체</option>
								                <option th:each="group : ${groupList}"
								                        th:value="${group.pageGroupId}"
								                        th:text="${group.groupName} + ' (' + ${group.basePath} + ')'"
								                        th:selected="${groupId != null and groupId == group.pageGroupId}">
								                </option>
								            </select>
								        </div>
								    </form>
								</div>
							</div>
							
							
									<div class="card">
								        <div class="card-body">
								            <div class="table-responsive">
								                <table class="table table-bordered table-hover align-middle mb-0">
								                    <thead class="table-light">
								                    <tr>
								                        <th style="width: 80px;">ID</th>
								                        <th style="width: 180px;">그룹명</th>
								                        <th style="width: 140px;">basePath</th>
								                        <th>페이지명</th>
								                        <th>서브명</th>
								                        <th style="width: 160px;">slug</th>
								                        <th style="width: 90px;">순서</th>
								                        <th style="width: 90px;">사용여부</th>
								                        <th style="width: 150px;">등록일</th>
								                        <th style="width: 150px;">수정일</th>
								                        <th style="width: 230px;">관리</th>
								                    </tr>
								                    </thead>
								                    
								                    
								                    <tbody>
									                    <tr th:if="${#lists.isEmpty(pageList)}">
									                        <td colspan="11" class="text-center py-4">등록된 데이터가 없습니다.</td>
									                    </tr>
									                    
									                    <tr th:each="page : ${pageList}">
														    <td th:text="${page.pageContentId}"></td>
														    <td th:text="${page.pageGroup.groupName}"></td>
														    <td th:text="${page.pageGroup.basePath}"></td>
														    <td th:text="${page.pageName}"></td>
														    <td th:text="${page.pageSubName}"></td>
														    <td th:text="${page.slug}"></td>
														    <td th:text="${page.pageIndex}"></td>
														
														    <td>
														        <span th:if="${page.useYn == 'Y'}">사용</span>
														        <span th:if="${page.useYn != 'Y'}">미사용</span>
														    </td>
														
														    <td th:text="${#temporals.format(page.createdAt,'yyyy-MM-dd HH:mm')}"></td>
														    <td th:text="${#temporals.format(page.updatedAt,'yyyy-MM-dd HH:mm')}"></td>
														
														    <td>
														        <a class="btn btn-theme" th:href="@{/admin/pageManager/form/{id}(id=${page.pageContentId})}">수정</a>
														        <form th:action="@{/admin/pageManager/delete}" method="post" style="display:inline;"
														              th:if="${page.useYn == 'Y'}"
														              onsubmit="return confirm('화면에서만 숨깁니다. 데이터는 남고 수정 화면에서 되돌릴 수 있습니다. 계속할까요?');">
														            <input type="hidden" name="id" th:value="${page.pageContentId}">
														            <button type="submit" class="btn btn-default">사용 안 함</button>
														        </form>
														        <form th:action="@{/admin/pageManager/remove}" method="post" style="display:inline;"
														              th:unless="${page.useYn == 'Y'}"
														              onsubmit="return confirm('이 페이지를 DB 에서 완전히 지웁니다. 되돌릴 수 없습니다. 계속할까요?');">
														            <input type="hidden" name="id" th:value="${page.pageContentId}">
														            <button type="submit" class="btn btn-danger">페이지삭제</button>
														        </form>
														        <form th:action="@{/admin/pageManager/removeGroup}" method="post" style="display:inline;"
														              th:if="${page.useYn != 'Y' and #strings.equalsIgnoreCase(page.slug, page.pageGroup.basePath)}"
														              class="group-delete-form" th:data-group="${page.pageGroup.groupName}">
														            <input type="hidden" name="groupId" th:value="${page.pageGroup.pageGroupId}">
														            <button type="submit" class="btn btn-danger">그룹삭제</button>
														        </form>
														    </td>
														</tr>
								                    </tbody>
								                </table>
								            </div>
								        </div>
								    </div>
						</div>
					</div>
				</div>
			</section>
		</section>
	</section>
	
	
	<th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>

	<script>
	// 그룹을 지우면 그 안의 페이지가 전부 같이 사라진다.
	// 어느 그룹인지 이름을 보여 주고 한 번 더 묻는다.
	// 사용 중인 페이지가 하나라도 있으면 서버가 거부한다.
	document.addEventListener('submit', function (e) {
		var form = e.target;
		if (!form.classList || !form.classList.contains('group-delete-form')) { return; }
		var name = form.getAttribute('data-group') || '';
		var ok = confirm('[' + name + '] 그룹을 DB 에서 지웁니다. '
			+ '그 안의 페이지가 전부 같이 사라지고, 그룹 주소도 없어집니다. '
			+ '되돌릴 수 없습니다. 계속할까요?');
		if (!ok) { e.preventDefault(); }
	});
	</script>
</body>

</html>

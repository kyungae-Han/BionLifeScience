<!DOCTYPE html>
<html lang="KO" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/admin/common :: headMenu}">
</head>


<body>

	<section id="container">
			<th:block th:replace="~{fragments/admin/common :: headMenu}"></th:block>
			<th:block th:replace="~{fragments/admin/common :: sideMenu('index')}"></th:block>
			
		<section id="main-content">
			<section class="wrapper">
				<div class="row mt">
					<div class="col-lg-8">
						<h4>비밀번호 변경</h4>
						<div class="form-panel">
							    <form th:action="@{/admin/passwordUpdate}" class="form-horizontal style-form" method="post" onsubmit="return preventDoubleSubmit(this)">
							        <div class="form-group">
							            <label for="oldPwd" class="col-lg-2 control-label">현재 비밀번호</label>
							            <div class="col-lg-10">
							            	<input class="form-control" id="oldPwd" type="password" name="oldPwd" required>
							            </div>
							        </div>
							
							        <div class="form-group">
							            <label for="newPwd" class="col-lg-2 control-label">새 비밀번호</label>
							            <div class="col-lg-10">
							            	<input class="form-control" id="newPwd" type="password" name="newPwd" required>
							            </div>
							        </div>
									<div class="form-group pb-3">
									  <div class="col-lg-12 text-center">
									    <button type="submit" class="btn btn-theme">비밀번호 변경</button>
									  </div>
									</div>
							        <p th:if="${param.error}" style="color:red;">현재 비밀번호가 일치하지 않습니다.</p>
							        <p th:if="${param.success}" style="color:green;">비밀번호가 성공적으로 변경되었습니다.</p>
							    </form>
						    </div>
					    </div>
				    </div>
		    </section>
	    </section>
	</section>
    
    <th:block th:replace="~{fragments/admin/common :: scriptSrc}"></th:block>
	<script src="/administration/lib/search.js" type="text/javascript"></script>
</body>
</html>

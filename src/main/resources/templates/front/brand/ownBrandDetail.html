<!DOCTYPE html>
<html dir="ltr" lang="ko" xmlns:th="http://www.thymeleaf.org" class="brand-page">

<head th:replace="~{/fragments/front/common :: headSrc('바이온라이프사이언스 기업소개')}">
</head>
<link rel="stylesheet" th:href="@{/front/css/imports/brand.css}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
	.text-ellipsis-3 {
	    display: -webkit-box;
	    -webkit-box-orient: vertical;
	    -webkit-line-clamp: 2;
	    overflow: hidden;
	    text-overflow: ellipsis;
	}
	.hashtags {border-top: 1px solid #e1e1e1;}
	.hashtags li:first-child {padding-top:14px;}
	
	
	.obtain span {
	    white-space: normal; 
	    display: inline-block;
	    max-width: 100%;
	    line-height: 1.3;
	}
	
	.obtain .badge {background-color: #b9d4fc; color: #555 !important;}
	
	.spec-label {width:24%; white-space: nowrap;}
	
	.spec-value {
	    display: inline-block;
	    white-space: normal;
	    word-break: break-word;        
	    overflow-wrap: break-word;   
	    flex: 1;                      
	}
	
	.entry-title {
		display: -webkit-box;
	    -webkit-box-orient: vertical;
	    -webkit-line-clamp: 2;
	    overflow: hidden;
	    text-overflow: ellipsis;
	}
</style>


<body class="stretched brand-page">

	<div id="wrapper" class="clearfix">

		<th:block
			th:replace="~{/fragments/front/common :: headerSrc(false, ${menuList})}"></th:block>

		<section id="brand-visual" class="brand-visual"
         th:style="'background-image: url(' + ${brand.visualRoad} + ');'">
		  <div class="brand-visual-overlay">
		  	<div class="inner">
			    <div class="brand-visual-text dark">
				      <h1 th:text="${brand.name}">Brand Title</h1>
				      <p class="sec-sub" th:text="${brand.content}">Brand Description</p>
				      <ol class="brand_breadcrumb">
				        <li><a href="/index">Home</a></li>
				        <li th:utext="${brand.name}">Brand Name</li>
				      </ol>
			    </div>
		    </div>
		  </div>
		</section>
		
		<section class="brand-body-container">
			<div th:utext="${brand.desc}"></div>
		</section>
		
		<!-- 상단 카테고리 탭 -->
		<section class="product-container" id="brandProdcutListItem">
		 	<div class="sec-head">
		 		<h3 class="text-center w-100 pb-4" th:text="${brand.name} +' '+'PRODUCT'"></h3>
		 		<p class="text-center pb-4" th:utext="'최고의 품질이 만드는 새로운 기준<br>'+'<span class=&quot;fw-bold fs-5&quot;>'+${brand.name}+'</span>'+'의 다양한 제품을 만나보세요.'">당사의 다양한 제품을 만나보세요. </p>
		 	</div>
		
			<div class="category-tabs">
			  <!-- BigSort 탭 -->
			  <ul class="pb-5" th:if="${sort == 'brand'}">
			   <li>
			      <button type="button"
			              class="tab-btn active"
			              data-id="all">All</button>
			    </li>
			    <li th:each="cat : ${bigSorts}">
			      <button type="button"
			              class="tab-btn"
			              th:attr="data-id=${cat.id}"
			              th:text="${cat.name}"
			              th:classappend="${cat.id == id} ? 'active' : ''">
			      </button>
			    </li>
			  </ul>
			
			  <!-- MiddleSort 탭 -->
			  <ul th:if="${sort == 'main'}">
			    <li th:each="cat : ${middleSorts}" th:if="${cat.bigSort.id == id}">
			      <button type="button"
			              class="tab-btn"
			              th:attr="data-id=${cat.id}"
			              th:text="${cat.name}"
			              th:classappend="${cat.id == id} ? 'active' : ''">
			      </button>
			    </li>
			  </ul>
			
			  <!-- SmallSort 탭 -->
			  <ul th:if="${sort == 'middle'}">
			    <li th:each="cat : ${smallSorts}" th:if="${cat.middleSort.id == id}">
			      <button type="button"
			              class="tab-btn"
			              th:attr="data-id=${cat.id}"
			              th:text="${cat.name}"
			              th:classappend="${cat.id == id} ? 'active' : ''">
			      </button>
			    </li>
			  </ul>
			</div>
	
	
			<div class="d-flex justify-content-between top-0 translate-middle-y sorted-select-box mb-4">
				<span class="fw-bold" th:text="'총'+${products.size()}+'개'"></span>
			  	<select id="sortSelect" class="form-select form-select-sm rounded-1 w-35 px-3" style="width: 180px; height:42px; line-height: 1.5;">
			  	    <option value="" disabled selected>정렬</option>
					<option value="recent">최근 등록순</option>
					<option value="az">A &rarr; Z</option>
					<option value="za">Z &rarr; A</option>			  	
			  	</select>
		  	</div>
			
			
			<div class="row gx-4 gy-5">
			  <div class="col-12">
			    
			    <div class="no-data" style="display:none;">데이터가 없습니다.</div>
			
			    <!-- ✅ products 전체를 감싸는 하나의 row -->
			    <div class="row g-4 justify-content-start product-list">
			
			      <!-- ✅ 반복문은 개별 col 단위에만 적용 -->
			      <div class="col-lg-3 col-6"
			           th:each="product : ${products}">
			        <div class="product-card sorted-entry h-100 card shadow-sm border-0 rounded-4 position-relative" style="padding-bottom: 0;"
			        th:attr="data-big-id=${product.bigSort?.id},
			                 data-middle-id=${product.middleSort != null ? product.middleSort.id : ''},
			                 data-small-id=${product.smallSort != null ? product.smallSort.id : ''},
			                 data-regdate=${product.id},
			                 data-name=${product.subject},
			                 data-sort-name=${product.subject.replace('[BIOTREAT]', '').trim()}
			                 ">
			                 
			          <div class="grid-inner pb-4">
			            <div class="entry-image mb-2 position-relative">
			              <a th:href="@{|/brandProductDetail/${product.id}|}">
			                <img th:src="${product.firstImageRoad}" alt="Product Image">
			              </a>
			              
			              <span class="badge bg-primary position-absolute top-0 start-0 m-3 px-3 py-2 rounded-pill"
						      th:text="${product.bigSort.name}">
						</span>
			            </div>
						  <h6 class="mb-0 mt-3" th:utext="${brand.name}"></h6>
			              <h3 class="entry-title fs-6" th:text="${product.subject}">
			                   Screw Caps and Tubes
			              </h3>
			
			            <div class="entry-content text-ellipsis-3 fs-6">
			              <p th:text="${product.content}">
			                간단한 제품에 대한 설명이 들어가는 영역입니다.
			              </p>
			            </div>
			            <div class="entry-meta" 
			                 th:if="${product.specs != null and !product.specs.isEmpty()}">
			              <ul class="list-unstyled w-100 mb-3 hashtags fs-6 flex-column">
			                <li class="text-wrap text-break w-100"
							    th:each="spec : ${product.specs}"
							    th:if="${spec.productSpecSubject != '제조사' and spec.productSpecSubject != '제조자' and spec.productSpecSubject != '특징' and spec.productSpecSubject != '특허'}">
							
								<div class="d-flex flex-start">
								    <span class="fw-semibold spec-label me-3" th:text="${
								        spec.productSpecSubject == '품목코드' or spec.productSpecSubject == '품번코드'  ? 'Model'
								      : spec.productSpecSubject == '패킹단위' ? 'Packing'
								      : spec.productSpecSubject == '제조국' ? 'Origin'
								      : spec.productSpecSubject == '재질' ? 'Material'
								      : spec.productSpecSubject == '무게' ? 'Weight'
								      : spec.productSpecSubject == '부피' ? 'Volume'
								      : spec.productSpecSubject
								    }"></span>
								    
								    <span class="spec-value"  th:utext="${spec.productSpecContent.replaceAll(',', ',<br>')}"></span>
							    </div>
							</li>
			              </ul>
			            </div>
			          </div>
						<div class="obtain position-absolute bottom-0 mb-lg-3 me-2 mb-1" th:each="specObtain : ${product.specs}"
						   th:if="${specObtain.productSpecSubject == '특허' or specObtain.productSpecSubject == '특징'}">
						   <span class="badge rounded-pill fw-semibold px-3 py-2" th:text="${specObtain.productSpecContent}"></span>
						</div>				              
			        </div>
			      </div>
			      <!-- /each -->
			
			    </div>
			  </div>
			</div>

		</section>


		<th:block th:replace="~{/fragments/front/common :: footerSrc}"></th:block>
	</div>
	<th:block th:replace="~{/fragments/front/common :: scriptSrc}"></th:block>
	
	
	<script>
document.addEventListener("DOMContentLoaded", function () {
  const tabs = document.querySelectorAll(".category-tabs .tab-btn");
  const cards = document.querySelectorAll(".product-card");
  const noData = document.querySelector(".no-data");

  function updateProductVisibility(selectedId) {
    let visibleCount = 0;

    cards.forEach(card => {
      const col = card.closest(".col-lg-3");
      const bigId = card.getAttribute("data-big-id");
      const middleId = card.getAttribute("data-middle-id");
      const smallId = card.getAttribute("data-small-id");

      if (selectedId === "all" || [bigId, middleId, smallId].includes(selectedId)) {
        col.style.display = "";
        visibleCount++;
      } else {
        col.style.display = "none";
      }
    });

    // ✅ 제품 보이는 개수에 따라 no-data 표시/숨김
    if (noData) {
      noData.style.display = visibleCount === 0 ? "block" : "none";
    }
  }

  tabs.forEach(tab => {
    tab.addEventListener("click", function () {
      const selectedId = this.getAttribute("data-id");

      // 탭 활성화 처리
      tabs.forEach(t => t.classList.remove("active"));
      this.classList.add("active");

      // 제품 필터링 업데이트
      updateProductVisibility(selectedId);
    });
  });

  // ✅ 초기 로드시 "All" 탭 활성화
  const defaultTab = document.querySelector(".category-tabs .tab-btn[data-id='all']");
  if (defaultTab) {
    defaultTab.classList.add("active");
    updateProductVisibility("all");
  }
});
</script>



<!-- 내부 sort 스크립트  -->
<script>

// 정렬 함수 분리
function applySort(sortType) {

  const items = [...document.querySelectorAll(".product-card")];
  const cols = items.map(item => item.closest(".col-lg-3"));

  if (sortType === "recent") {
    cols.sort((a, b) => {
      return Number(b.querySelector('.product-card').dataset.regdate) 
           - Number(a.querySelector('.product-card').dataset.regdate);
    });
  }

  if (sortType === "az") {
    cols.sort((a, b) => {
      return a.querySelector('.product-card').dataset.sortName
             .localeCompare(b.querySelector('.product-card').dataset.sortName);
    });
  }

  if (sortType === "za") {
    cols.sort((a, b) => {
      return b.querySelector('.product-card').dataset.sortName
             .localeCompare(a.querySelector('.product-card').dataset.sortName);
    });
  }

  const container = document.querySelector(".product-list");
  cols.forEach(col => container.appendChild(col));
}


// select 변경 시 실행
document.getElementById("sortSelect").addEventListener("change", function() {
  applySort(this.value);
});


// ⭐ 페이지 로딩 시 자동으로 recent 정렬 실행
document.addEventListener("DOMContentLoaded", function () {
  applySort("recent");
});
</script>



</body>
</html>

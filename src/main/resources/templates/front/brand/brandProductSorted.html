<!DOCTYPE html>
<html dir="ltr" lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{/fragments/front/common :: headSrc('바이온라이프사이언스 기업소개')}">
</head>

<link rel="stylesheet" th:href="@{/front/css/imports/company.css}">
<style>
#page-title { padding:0 !important; margin: 17px 0; text-align: left !important;}	
.breadcrumb {justify-content: left !important; padding: 0 200px 20px; border-bottom: 1px solid #eee;}

@media(max-width: 991px){
	#page-title {margin-top: 120px;}
	.breadcrumb {padding: 0 20px 20px;}
}
</style>	


<body class="stretched">
<div id="wrapper" class="clearfix">

    <th:block th:replace="~{/fragments/front/common :: headerSrc(false, ${menuList})}"></th:block>
	

	<section id="page-title" class="clearfix">
		<ol class="breadcrumb">
			<li class="breadcrumb-item"><a href="/index">메인</a></li>
			<li class="breadcrumb-item active" aria-current="page">제품리스트</li>
		</ol>
	</section>

    <!-- 목록 섹션: products가 존재하고 요소가 1개 이상일 때만 렌더링 -->
    <section id="content" th:if="${products != null and products.totalElements > 0}">
        <div class="content-wrap list-inner">
            <div class="container clearfix">

                <div class="border-top-0 m-0">
                    <div class="container text-center">
                        <div class="heading-block center">
                            <h2 th:text="${brandInfo.name}">Tubes</h2>
                            <span th:text="${name}">카테고리명</span>
                        </div>
                    </div>
                </div>

                <div class="row gutter-40 col-mb-80">
                    <div class="postcontent col-lg-12 order-lg-last">
                        <div id="posts" class="row grid-container gutter-30">

                            <div class="entry sorted-entry col-lg-4 col-6" th:each="product : ${products}">
                                <div class="grid-inner">
                                    <div class="entry-image mb-2">
                                        <a th:href="@{|/brandProductDetail/${product.id}|}">
                                            <img th:src="${product.firstImageRoad}" alt="#">
                                        </a>
                                    </div>

                                    <div class="entry-title">
                                        <h2>
                                            <a th:href="@{|/brandProductDetail/${product.id}|}"
                                               th:text="${product.subject}">Screw Caps and Tubes</a>
                                        </h2>
                                    </div>

                                    <div class="entry-meta">
                                        <ul>
                                            <li th:each="spec : ${product.specs}">
                                                <i class="icon-folder-open"></i>
                                                # [[${spec.productSpecContent}]]
                                            </li>
                                        </ul>
                                    </div>

                                    <div class="entry-content mt-1">
                                        <p th:text="${product.content}">
                                            간단한 제품에 대한 설명이 들어가는 영역입니다.
                                        </p>
                                    </div>
                                     <a th:href="@{|/brandProductDetail/${product.id}|}" class="more-link">
                                         자세히 보기 <i class="icon-line-arrow-right"></i>
                                     </a>
                                </div>
                            </div>
                        </div>

                        <!-- 페이지네이션 -->
                        <div class="d-flex justify-content-center mt-5">
                            <nav aria-label="navigation" style="text-align: center;">
                                <ul class="pagination justify-content-center">

                                    <!-- First -->
                                    <li class="page-item"
                                        th:classappend="${1 == products.pageable.pageNumber + 1} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{/brandProductSorted/{sort}/{id}(sort=${sort}, id=${id}, page=0, size=${param.size})}">
                                            First
                                        </a>
                                    </li>

                                    <!-- Previous -->
                                    <li class="page-item"
                                        th:classappend="${1 == products.pageable.pageNumber + 1} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{/brandProductSorted/{sort}/{id}(sort=${sort}, id=${id}, page=${products.pageable.pageNumber - 1}, size=${param.size})}">
                                            Previous
                                        </a>
                                    </li>

                                    <!-- Page Numbers -->
                                    <li class="page-item"
                                        th:each="i : ${#numbers.sequence(startPage, endPage)}"
                                        th:classappend="${i == products.pageable.pageNumber + 1} ? 'active'">
                                        <a class="page-link"
                                           th:text="${i}"
                                           th:href="@{/brandProductSorted/{sort}/{id}(sort=${sort}, id=${id}, page=${i - 1}, size=${param.size})}">
                                        </a>
                                    </li>

                                    <!-- Next -->
                                    <li class="page-item"
                                        th:classappend="${products.totalPages == products.pageable.pageNumber + 1} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{/brandProductSorted/{sort}/{id}(sort=${sort}, id=${id}, page=${products.pageable.pageNumber + 1}, size=${param.size})}">
                                            Next
                                        </a>
                                    </li>

                                    <!-- Last -->
                                    <li class="page-item"
                                        th:classappend="${products.totalPages == products.pageable.pageNumber + 1} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{/brandProductSorted/{sort}/{id}(sort=${sort}, id=${id}, page=${products.totalPages - 1}, size=${param.size})}">
                                            Last
                                        </a>
                                    </li>

                                </ul>
                            </nav>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- 빈 목록 섹션 -->
    <section id="content" th:if="${products == null or products.totalElements == 0}">
        <div class="content-wrap list-inner">
            <div class="container clearfix">
                <div class="border-top-0 m-0">
                    <div class="container text-center">
                        <div class="heading-block center">
                            <h2 th:text="${name}">Tubes</h2>
                            <span>There are no products in this category.</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <th:block th:replace="~{/fragments/front/common :: footerSrc}"></th:block>
</div>

<th:block th:replace="~{/fragments/front/common :: scriptSrc}"></th:block>
<script src="/front/js/timeline.js"></script>
</body>
</html>

<!DOCTYPE html>
<html dir="ltr" lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{/fragments/front/common :: headSrc('바이온라이프사이언스 공지사항')}">
</head>
<link rel="stylesheet" th:href="@{/front/css/imports/company.css}">


<body class="stretched">

	<div id="wrapper" class="clearfix">

		<th:block th:replace="~{/fragments/front/common :: headerSrc(false, ${menuList})}"></th:block>


		<div id="page-title">
			<h1 class="sec-head">공지 사항</h1>
		</div>

		<section id="content">
			<div class="search-container notice-search-form">
				<div class="search_module">
					<form class="search" th:action="@{/noticeList}" method="get">
					  <input class="search_bar__input" type="text" name="searchText" th:value="${searchText}" placeholder="검색어를 입력하세요.">
					  <button type="submit"><i class="bi bi-search"></i></button>
					</form>
				</div>
			</div>
			<div class="notice_body">
				<table>
				  <thead>
				    <tr>
				      <th>번호</th>
				      <th>제목</th>
				      <th>날짜</th>
				    </tr>
				  </thead>
				  <tbody>
				    <!-- (선택) 중요공지 고정 출력 -->
				    <tr class="notice__important" th:each="n : ${pinned}">
				      <td>공지</td>
				      <td class="table__subject">
				        <a th:href="@{'/noticeDetail/' + ${n.id}}" th:text="${n.subject}"></a>
				      </td>
				      <td th:text="${#dates.format(n.date, 'YYYY-MM-dd')}"></td>
				    </tr>
				
				    <!-- 목록 없을 때 -->
				    <tr th:if="${#lists.isEmpty(noticeList)}">
				      <td colspan="3" class="text-center">게시물이 없습니다.</td>
				    </tr>
				
				    <!-- 일반 목록 -->
				    <tr th:each="n, stat : ${noticeList}">
				      <!-- 전체 건수 기준 내림차순 번호 -->
				      <td th:text="${page.totalElements - (page.number * page.size) - stat.index}"></td>
				      <td class="table__subject">
				        <a th:href="@{'/noticeDetail/' + ${n.id}}" th:text="${n.subject}"></a>
				      </td>
				      <td th:text="${#dates.format(n.date, 'YYYY-MM-dd')}"></td>
				    </tr>
				  </tbody>
				</table>
			</div>	
			<div class="pagination">
			  <!-- 이전 -->
			  <a class="page-prev-btn nav-btn" th:if="${page.hasPrevious()}"
			     th:href="@{/noticeList(page=${page.number}, searchText=${param.searchText})}">이전</a>
			
			  <!-- 가운데 숫자들(현재 기준 -4 ~ +5 범위) -->
			  <a th:each="i : ${#numbers.sequence(
                    T(java.lang.Math).max(1, nowPage - 4),
                    T(java.lang.Math).min(page.totalPages, nowPage + 5))}"
				     th:href="@{/noticeList(page=${i}, searchText=${param.searchText})}"
				     th:text="${i}"
				     th:classappend="${i == nowPage} ? 'active'"></a>

			
			  <!-- 다음 -->
			  <a class="page-next-btn nav-btn" th:if="${page.hasNext()}"
			     th:href="@{/notice(page=${page.number + 2}, searchText=${param.searchText})}">다음</a>
			</div>

		</section>
		
		

		<th:block th:replace="~{/fragments/front/common :: footerSrc}"></th:block>
	</div>
	<th:block th:replace="~{/fragments/front/common :: scriptSrc}"></th:block>
	
	
	<script>
	  const q = document.querySelector('.search_bar__input');
	  q.addEventListener('focus', () => {
	    if (!q.dataset.cleared) {         // 처음 포커스일 때만
	      q.value = '';
	      q.dataset.cleared = '1';
	    }
	  });
	</script>

</body>
</html>

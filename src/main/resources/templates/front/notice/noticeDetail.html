<!DOCTYPE html>
<html dir="ltr" lang="ko" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{/fragments/front/common :: headSrc(${notice != null ? @enText.pick(notice.subject, notice.subjectEn) + ' | 바이온라이프사이언스 공지사항' : '바이온라이프사이언스 공지사항'})}">
</head>
<link rel="stylesheet" th:href="@{/front/css/imports/company.css}">

<style>
#page-title { padding:0 !important; margin: 17px 0; text-align: left !important;}	
.breadcrumb {justify-content: left !important; padding: 0 200px 20px; border-bottom: 1px solid #eee;}

@media(max-width: 991px){
	#page-title {margin-top: 120px;}
	.breadcrumb {padding: 0 20px 20px;}
}
</style>	



<body class="stretched notice-detail-body">

	<div id="wrapper" class="clearfix">

		<th:block th:replace="~{/fragments/front/common :: headerSrc(false, ${menuList})}"></th:block>
		
		<section id="page-title" class="clearfix">
			<ol class="breadcrumb">
				<li class="breadcrumb-item"><a href="/index">메인</a></li>
				<li class="breadcrumb-item active" aria-current="page">공지사항</li>
			</ol>
		</section>

		<section id="content">
		  <div class="notice-detail">
		
		    <!-- 단일 객체 사용: th:each 쓰지 말기 -->
		    
		    <div class="sec-head left">
			    <h3 class="mt-3" th:text="'제목 : ' + ${@enText.pick(notice.subject, notice.subjectEn)}">제목</h3>
			    <span th:if="${notice != null and notice.date != null}"
			            th:text="'날짜 : '+${#dates.format(notice.date, 'yyyy-MM-dd')}">2023-06-27</span>
			</div>
		    <hr>
		
		    <!-- 내용: HTML 포함이면 utext, 순수 텍스트면 text + CSS white-space -->
		    <div th:utext="${@enText.pick(notice.content, notice.contentEn)}">내용</div>
		    
		    
		  </div>
		  
		  
		<!-- 상세 본문 아래에 배치 -->
		<div class="notice_list_page">
		  <!-- ⚠️ 단추마다 .nav-btn-bob 껍데기를 하나씩 두는 것이 중요하다.
		       호버를 감지하는 쪽(껍데기)은 가만히 있고 움직이는 쪽(.nav-btn)만 둥실거려야
		       테두리에 커서를 걸쳤을 때 떨리지 않는다. 껍데기를 하나로 묶으면 셋이 같이 움직인다.
		       자세한 사정은 custom.css 의 "둥실 모션 호버 떨림" 주석에 있다.
		       th:if 는 껍데기에 둔다. 그래야 안 쓰는 껍데기가 남지 않는다. -->

		  <!-- 이전 -->
		  <span class="nav-btn-bob" th:if="${prevNotice != null}">
		    <a class="nav-btn prev"
		       th:href="@{/noticeDetail/{id}(id=${prevNotice.id})}">이전</a>
		  </span>
		  <span class="nav-btn-bob" th:if="${prevNotice == null}">
		    <span class="nav-btn prev disabled">이전</span>
		  </span>
		  
		  
		  <!-- 목록 -->
		  <span class="nav-btn-bob">
		    <a class="nav-btn list"
		       th:href="@{/noticeList(
		                 page=${param.page} ?: 1,
		                 searchText=${param.searchText} ?: ''
		               )}">목록</a>
		  </span>
		
		  <!-- 다음 -->
		  <span class="nav-btn-bob" th:if="${nextNotice != null}">
		    <a class="nav-btn next"
		       th:href="@{/noticeDetail/{id}(id=${nextNotice.id})}">다음</a>
		  </span>
		  <span class="nav-btn-bob" th:if="${nextNotice == null}">
		    <span class="nav-btn next disabled">다음</span>
		  </span>
		</div>
		</section>
	



		<th:block th:replace="~{/fragments/front/common :: footerSrc}"></th:block>
	</div>
	<th:block th:replace="~{/fragments/front/common :: scriptSrc}"></th:block>
	
	

</body>
</html>

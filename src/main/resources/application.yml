# 동작 환경 설정
spring:
  application:
    name: BionLifeScienceWeb
  profiles:
    active: prod
  thymeleaf:
    cache: false
server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 1440m      # 60m * 24h * 30d
      cookie:
        max-age: 1440m    # 60m * 24h * 30d
        name: SID
        http-only: true
        secure: true
  tomcat:
    max-http-form-post-size: 1000MB		 				
# 개발 환경
--- 
spring:
  config:
    activate: 
      on-profile: test
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
#    url: jdbc:mariadb://183.111.199.216:3306/bionls?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
#    username: bionls
#    password: bion2272!@
    url: jdbc:mariadb://127.0.0.1:3306/bionls?useUnicode=true&characterEncoding=utf8
    username: root
    password: 1234
    hikari:
      connectionTimeout: 30000
      maximumPoolSize: 10
      maxLifetime: 1800000
      poolName: HikariCP
      readOnly: false
      connectionTestQuery: SELECT 1
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: -1
  mail:
    host: smtps.hiworks.com
    port: 465
    username: ${HIWORKS_MAIL_USERNAME}
    password: ${HIWORKS_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtps.hiworks.com
      mail.smtp.starttls.enable: false
  upload.path: src/main/resources/static/administration
  upload.env: local


# 배포 환경
--- 
spring:
  config:
    activate: 
      on-profile: prod
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/bionls?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: bionls
    password: ${DB_PASSWORD}
    hikari:
      connectionTimeout: 30000
      maximumPoolSize: 10
      maxLifetime: 1800000
      poolName: HikariCP
      readOnly: false
      connectionTestQuery: SELECT 1
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: -1
  mail:
    host: smtp.hiworks.com
    port: 465
    username: ${HIWORKS_MAIL_USERNAME}
    password: ${HIWORKS_MAIL_PASSWORD}
    protocol: smtps
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: false
  upload.path: /home/hosting_users/bionls/tomcat/webapps
  upload.env: prod


    

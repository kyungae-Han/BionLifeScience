# 동작 환경 설정
spring:
  application:
    name: BionLifeScienceWeb
  profiles:
    active: prod
  thymeleaf:
    cache: false
server:
  port: 8080
  servlet:
    context-path: /
    session:
      timeout: 1440m      # 60m * 24h * 30d
      cookie:
        max-age: 1440m    # 60m * 24h * 30d
        name: SID
        http-only: true
        secure: true
  tomcat:
    max-http-form-post-size: 1000MB		 				

# SEO 설정 (전 프로필 공통)
app:
  # canonical / og:url / sitemap.xml 의 절대 URL 기준
  base-url: https://bionlifescience.com
  verification:
    # 네이버 서치어드바이저 > 사이트 소유확인
    naver: 9514eb1c8c3941a3324eca020991e321ced120e2
    # 구글 서치콘솔 > 소유권 확인 > HTML 태그 에서 발급받은 content 값만 붙여넣기
    # (비워두면 meta 태그가 아예 출력되지 않음)
    google: ""

# 개발 환경
--- 
spring:
  config:
    activate: 
      on-profile: test
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://127.0.0.1:3306/bionls?useUnicode=true&characterEncoding=utf8
    username: root
    password: 1234
    hikari:
      connectionTimeout: 30000
      maximumPoolSize: 10
      maxLifetime: 1800000
      poolName: HikariCP
      readOnly: false
      connectionTestQuery: SELECT 1
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: -1
  mail:
    host: smtps.hiworks.com
    port: 465
    username: ${HIWORKS_MAIL_USERNAME}
    password: ${HIWORKS_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtps.hiworks.com
      mail.smtp.starttls.enable: false
  upload.path: src/main/resources/static/administration
  upload.env: local


# 배포 환경
--- 
spring:
  config:
    activate: 
      on-profile: prod
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/bionls?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Seoul
    username: bionls
    password: ${DB_PASSWORD}
    hikari:
      connectionTimeout: 30000
      maximumPoolSize: 10
      maxLifetime: 1800000
      poolName: HikariCP
      readOnly: false
      connectionTestQuery: SELECT 1
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: -1
  mail:
    host: smtp.hiworks.com
    port: 465
    username: ${HIWORKS_MAIL_USERNAME}
    password: ${HIWORKS_MAIL_PASSWORD}
    protocol: smtps
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.starttls.enable: false
  upload.path: /home/hosting_users/bionls/tomcat/webapps
  upload.env: prod


    
